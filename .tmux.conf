# ~/.tmux.conf — next-3.8 + Windows Terminal (WSL2)
# Only options that differ from stock next-3.8.
# Prefix: M-a  |  reload: prefix r
#
# WT: unbind Alt+a / Alt+p / Alt+hjkl / Alt+0-9 if they steal focus.
# WT: allow OSC 52 clipboard write if the option exists.

# ── Server ────────────────────────────────────────────────────────
set -s escape-time 0
set -s focus-events on
set -s extended-keys on
set -s set-clipboard on
set -s history-file "~/.tmux_history"

# Stock xterm* already has clipboard/ccolour/cstyle/focus/title.
# Reset user features on reload, then add RGB/undercurl/etc.
set -su terminal-features
set -as terminal-features ",xterm*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync:overline"
set -as terminal-features ",tmux*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync:overline"
set -as terminal-features ",alacritty*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync"
set -as terminal-features ",kitty*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync"
set -as terminal-features ",wezterm*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync"
set -as terminal-features ",foot*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync"

# WSL → Windows clipboard (copy-pipe* with no command uses this).
if-shell 'command -v win32yank.exe >/dev/null 2>&1' {
  set -s copy-command "win32yank.exe -i --crlf"
} {
  if-shell 'command -v clip.exe >/dev/null 2>&1' {
    set -s copy-command "clip.exe"
  }
}

# ── Session ───────────────────────────────────────────────────────
set -g prefix M-a
unbind-key C-b
bind-key M-a send-prefix

set -g status-keys emacs
set -g allow-passthrough all
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows off
set -g history-limit 100000
set -g aggressive-resize on
set -g display-time 2000
set -g display-panes-time 1500
set -g status-position top
set -g detach-on-destroy off
set -g repeat-time 300
set -g set-titles on
set -g pane-border-status top
set -g set-titles-string "#S · #W#{?pane_title, · #{pane_title},}"

# Default update-environment + WT/WSL vars (full replace, reload-safe).
set -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WAYLAND_DISPLAY WINDOWID XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE WT_SESSION WT_PROFILE_ID COLORTERM TERM_PROGRAM WSL_INTEROP WSL_DISTRO_NAME"

# ── Window ────────────────────────────────────────────────────────
# Keep mouse selection predictable regardless of the shell's editor setting.
set -g mouse on
setw -g mode-keys vi

# Overlay a slim scrollbar while browsing history; do not reflow pane text.
setw -g pane-scrollbars modal
setw -g pane-scrollbars-timeout 1500
setw -g pane-scrollbars-style "fg=#8eabc4,bg=#2b3239,width=1,pad=0"

# ── Keybindings ───────────────────────────────────────────────────
bind-key r source-file ~/.tmux.conf \; display-message "reloaded ~/.tmux.conf"

bind-key c new-window -c "#{pane_current_path}"
bind-key C new-window -c "#{pane_current_path}" \;\
  new-window -c "#{pane_current_path}" \;\
  new-window -c "#{pane_current_path}" \;\
  new-window -c "#{pane_current_path}" \;\
  new-window -c "#{pane_current_path}" \;\
  new-window -c "#{pane_current_path}" \;\
  new-window -c "#{pane_current_path}" \;\
  new-window -c "#{pane_current_path}" \;\
  new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key %  split-window -h -c "#{pane_current_path}"
bind-key |  split-window -h -c "#{pane_current_path}"
bind-key -  split-window -v -c "#{pane_current_path}"

bind-key v copy-mode
if-shell 'command -v win32yank.exe >/dev/null 2>&1' {
  bind-key p run-shell 'win32yank.exe -o --lf 2>/dev/null | tmux load-buffer -b wt - && tmux paste-buffer -b wt -p -d'
} {
  bind-key p paste-buffer -p
}
bind-key P choose-buffer

# Mouse history: scroll the hovered pane without changing keyboard focus.
# Preserve mouse handling in applications and alternate-screen programs.
bind-key -n WheelUpPane {
  if -Ft= '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' {
    send-keys -M
  } {
    copy-mode -e -t=
    send-keys -N 3 -X -t= scroll-up
  }
}
bind-key -T copy-mode-vi WheelUpPane send-keys -N 3 -X -t= scroll-up
bind-key -T copy-mode-vi WheelDownPane {
  send-keys -N 3 -X -t= scroll-down
  # Return to live output only when there is no selection to preserve.
  if -Ft= '#{&&:#{==:#{scroll_position},0},#{!:#{selection_present}}}' {
    send-keys -X -t= cancel
  }
}

# Click clears the highlight; a click at the live edge resumes normal input.
# At older output, keep the scroll position so a new drag starts there.
bind-key -T copy-mode-vi MouseDown1Pane {
  select-pane -t=
  send-keys -X -t= clear-selection
  if -Ft= '#{==:#{scroll_position},0}' { send-keys -X -t= cancel }
}

# Drag release, double click and triple click all copy without jumping back.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X -t= copy-pipe-no-clear
bind-key -T copy-mode-vi DoubleClick1Pane {
  select-pane -t=
  send-keys -X -t= select-word
  send-keys -X -t= copy-pipe-no-clear
}
bind-key -T copy-mode-vi TripleClick1Pane {
  select-pane -t=
  send-keys -X -t= select-line
  send-keys -X -t= copy-pipe-no-clear
}
bind-key -n DoubleClick1Pane {
  select-pane -t=
  if -Ft= '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
    send-keys -M
  } {
    copy-mode -H -t=
    send-keys -X -t= select-word
    send-keys -X -t= copy-pipe-no-clear
  }
}
bind-key -n TripleClick1Pane {
  select-pane -t=
  if -Ft= '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
    send-keys -M
  } {
    copy-mode -H -t=
    send-keys -X -t= select-line
    send-keys -X -t= copy-pipe-no-clear
  }
}

# Ctrl+C copies an existing selection; outside copy mode it still interrupts.
bind-key -T copy-mode-vi C-c if -F '#{selection_present}' {
  send-keys -X copy-pipe-no-clear
} {
  send-keys -X cancel
}
bind-key -T copy-mode-vi C-Home send-keys -X history-top
bind-key -T copy-mode-vi C-End send-keys -X cancel

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

unbind-key L
bind-key H swap-pane -d -t "{left-of}"
bind-key J swap-pane -d -t "{down-of}"
bind-key K swap-pane -d -t "{up-of}"
bind-key L swap-pane -d -t "{right-of}"

bind-key -r C-h resize-pane -L 5
bind-key -r C-j resize-pane -D 5
bind-key -r C-k resize-pane -U 5
bind-key -r C-l resize-pane -R 5

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-0 select-window -t 10

bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Create floating pane: Alt+drag (stock is Ctrl+drag). Plain border drag still
# moves/resizes floating panes via MouseDrag1Border → resize-pane -M.
unbind-key -n C-MouseDrag1Pane
unbind-key -n C-MouseDrag1Empty
unbind-key -n M-MouseDrag1Pane
unbind-key -n M-MouseDrag1Border
bind-key -n M-MouseDrag1Pane  new-pane -M -c "#{pane_current_path}"
bind-key -n M-MouseDrag1Empty new-pane -M -c "#{pane_current_path}"

unbind-key Right
unbind-key Up
unbind-key Down
unbind-key Left

bind-key -n End  send-keys C-e
bind-key -n Home send-keys C-a

# bind-key s set-window-option synchronize-panes \; \
#   display-message "synchronize-panes: #{?pane_synchronized,on,off}"

bind-key Tab last-window
bind-key X kill-pane
bind-key S command-prompt -p "session name:" "new-session -A -s '%%'"
bind-key w choose-tree -Zw
bind-key g choose-tree -Zs

# ── Appearance (Graphite / Minimal) ────────────────────────────────
# Graphite surfaces, soft blue focus, muted gold for manually named windows.
# bg: #202428  surface: #2b3239  border: #414951  muted: #929ba5
# text: #d7dde5  accent: #8eabc4  gold: #c8b287

set -g mode-style "fg=#202428,bg=#8eabc4"
set -g copy-mode-match-style "fg=#d7dde5,bg=#414951"
set -g copy-mode-current-match-style "fg=#202428,bg=#8eabc4,bold"

# Prompts, menus and popups share the same quiet surface.
set -g message-style "fg=#d7dde5,bg=#2b3239,fill=#2b3239"
set -g message-command-style "fg=#8eabc4,bg=#2b3239,fill=#2b3239"
set -g menu-style "fg=#d7dde5,bg=#2b3239"
set -g menu-selected-style "fg=#202428,bg=#8eabc4,bold"
set -g menu-border-style "fg=#414951,bg=#2b3239"
set -g menu-border-lines rounded
set -g popup-style "fg=#d7dde5,bg=#202428"
set -g popup-border-style "fg=#8eabc4,bg=#202428"
set -g popup-border-lines rounded

# Single-line pane borders; keep the existing clickable controls.
set -g pane-border-lines single
set -g pane-border-style "fg=#414951"
set -g pane-active-border-style "fg=#8eabc4"
# Split style attributes inside conditionals: commas separate their branches.
set -g pane-border-format "#[align=centre]#{?pane_active,#[fg=#b5c9da]#[bg=#2b3239],#[fg=#929ba5]#[bg=default]} #P · #{=40:pane_title} #[default]#{?#{mouse},#[align=right]#[range=control|7]#{?pane_active,#[fg=#8eabc4],#[fg=#626d78]} #{?#{pane_floating_flag},󰖲,󰕰} #[norange]#[range=control|8]#{?pane_active,#[fg=#d7dde5],#[fg=#626d78]} #{?#{window_zoomed_flag},󰊔,󰊓} #[norange]#[range=control|9]#{?pane_active,#[fg=#929ba5],#[fg=#626d78]} 󰅖 #[norange],}"

# One line at the top, with a small session badge and softly filled active tab.
set -g status-interval 5
set -g status-style "bg=#202428,fg=#929ba5"
set -g status-left-length 28
set -g status-right-length 64
set -g window-status-separator " "

# The badge lights up while the prefix key is waiting for a command.
set -g status-left "#{?client_prefix,#[fg=#202428]#[bg=#8eabc4],#[fg=#b5c9da]#[bg=#2b3239]}#[bold] #{=20:session_name} #[default]  "

# Hide the date below 120 columns and the path below 90, leaving room for tabs.
set -g status-right "#{?#{e|>=:#{client_width},90},#[fg=#929ba5]#{=24:#{b:pane_current_path}}#[fg=#626d78]  ·  ,}#{?#{e|>=:#{client_width},120},#[fg=#929ba5]%Y-%m-%d#[fg=#626d78]  ·  ,}#[fg=#d7dde5]%H:%M "

# Preserve the muted-gold cue for manually named windows.
set -g window-status-style "fg=#929ba5,bg=default,none"
set -g window-status-current-style "fg=#d7dde5,bg=#2b3239,bold,nounderscore"
set -g window-status-format " #{?automatic-rename,#[fg=#929ba5]#I #W,#[fg=#c8b287]#I #W} "
set -g window-status-current-format " #{?automatic-rename,#[fg=#8eabc4]#I #[fg=#d7dde5]#W,#[fg=#c8b287]#I #[fg=#e2d5bc]#W}#{?window_zoomed_flag, #[fg=#8eabc4]󰊔,} "
set -g window-status-activity-style "fg=#d7dde5,bg=#2b3239"
set -g window-status-bell-style "fg=#c8b287,bg=#2b3239,bold"

# ── Plugins (TPM) ─────────────────────────────────────────────────
set -g @resurrect-processes "false"
set -g @resurrect-strategy-vim "session"
set -g @resurrect-strategy-nvim "session"
set -g @resurrect-capture-pane-contents "on"

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-resurrect"
 

run-shell "~/.tmux/plugins/tpm/tpm"
