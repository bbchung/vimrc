# tmux next-3.9 (58a830277) · WSL2 / Windows Terminal
# Prefix: Alt+a · Quick actions: Alt+a ? · Reload: Alt+a r
# Fuzzy (switch-mode): Alt+a f (window) · F (session) · ' (pane) · / (keys)
# Floating & view: Alt+a ` (scratch) · t (float/dock) · g (snap) · B (border) · \ (sidebar)
# Native themes, floating panes, fuzzy switch-mode, OSC 133/7501/9;4 and vi copy mode.
# The default palette is Atelier (~/.tmux/themes/atelier.conf).

# ── Terminal and server ───────────────────────────────────────────
set -s default-terminal tmux-256color
set -s editor nvim
set -s escape-time 0
set -s focus-events on
set -s extended-keys on
set -s set-clipboard on
set -s history-file "~/.tmux_history"

# Rebuild terminal features on reload (incl. next-3.9 sixel cache & kittygraphics/imagescroll).
set -su terminal-features
set -as terminal-features ",xterm*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync:overline:osc7:progressbar:sixel"
set -as terminal-features ",tmux*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync:overline:sixel"
set -as terminal-features ",kitty*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync:overline:osc7:progressbar:kittygraphics:imagescroll"
set -as terminal-features ",ghostty*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync:overline:osc7:progressbar:kittygraphics:imagescroll"
set -as terminal-features ",wezterm*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync:overline:osc7:progressbar:sixel"
set -as terminal-features ",alacritty*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync:osc7"
set -as terminal-features ",foot*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync:osc7:sixel"

set -g mouse on
set -g allow-passthrough all
set -g detach-on-destroy off
set -g aggressive-resize on
set -g base-index 1
set -g pane-base-index 1
set -g history-limit 100000
set -g display-time 2000
set -g display-panes-time 2000
set -g initial-repeat-time 600
set -g repeat-time 300
set -g status-keys emacs
set -g mode-keys vi
set -g copy-mode-keep-column on
set -g set-titles on
set -g set-titles-string "#S · #W#{?pane_title, · #{pane_title},}"
set -g monitor-bell on
set -g visual-bell off

# Refresh Windows Terminal and WSL variables alongside tmux's defaults.
set -gu update-environment
set -ag update-environment "WT_SESSION WT_PROFILE_ID COLORTERM TERM_PROGRAM WSL_INTEROP WSL_DISTRO_NAME"

# Clean up legacy user options on reload.
set -gu @status-session-style
set -gu @session-pill
set -gu @pane-index
set -gu @status-mode
set -gu @status-context
set -gu @status-hint
set -gu @tab-columns
set -gu @tab-room
set -gu @inactive-window-name
set -gu @active-name-room
set -gu @active-window-name
set -gu @window-name
set -gu @window-name-width
set -gu @pane-label-raw
set -gu @pane-detail-format
set -gu @pane-caption-format
set -gu @pane-border-draw

# ── Workspace and Quick actions ──────────────────────────────────
set -g prefix M-a
unbind-key C-b
bind-key -N 'Send Alt+a to the pane' M-a send-prefix
bind-key -N 'Reload ~/.tmux.conf' r {
  source-file ~/.tmux.conf
  display-message "Reloaded ~/.tmux.conf"
}

# Menus use the same actions as the prefix table. Parse the aliases when opened.
# Keyboard opens in the centre. The status click opens below the right segment.
set -s 'command-alias[quick-actions]' 'quick-actions=display-menu -M -T "#[align=centre fg=themeblue bold] ◈ Quick actions " \
  -x "#{?mouse_absolute_x,#{e|-:#{window_width},#{popup_width}},#{popup_centre_x}}" \
  -y "#{?mouse_absolute_x,#{popup_status_line_y},#{popup_centre_y}}" \
  "Switch window"             f { switch-client -T prefix; send-keys -K f } \
  "Switch session"            F { switch-client -T prefix; send-keys -K F } \
  "Jump to pane"          "\047" { switch-client -T prefix; send-keys -K "\047" } \
  "#{?#{==:#{side-status},off},Show sidebar,Hide sidebar}" "\134" { switch-client -T prefix; send-keys -K "\134" } \
  "" \
  "New window"                c { switch-client -T prefix; send-keys -K c } \
  "Split side by side"      "|" { switch-client -T prefix; send-keys -K "|" } \
  "Split top and bottom"    "-" { switch-client -T prefix; send-keys -K "-" } \
  "Floating scratchpad"     "`" { switch-client -T prefix; send-keys -K "`" } \
  "" \
  "Search key bindings"     "/" { switch-client -T prefix; send-keys -K "/" } \
  "More actions ›"            m { run-shell -C "quick-actions-more" }'
set -s 'command-alias[quick-actions-more]' 'quick-actions-more=display-menu -M -x L -y L -T "#[align=centre fg=themeblue bold] ◈ More actions " \
  "Session tree"              s { switch-client -T prefix; send-keys -K s } \
  "Window tree"               w { switch-client -T prefix; send-keys -K w } \
  "" \
  "#{?pane_floating_flag,Dock pane,#{?window_zoomed_flag,,Float pane}}" t { switch-client -T prefix; send-keys -K t } \
  "#{?#{e|>:#{window_panes},1},#{?window_zoomed_flag,Unzoom pane,Zoom pane},}" z { switch-client -T prefix; send-keys -K z } \
  "#{?#{e|>:#{window_panes},1},Equalize panes,}" E { switch-client -T prefix; send-keys -K E } \
  "#{?#{e|>:#{window_panes},1},#{?pane_synchronized,Disable pane sync,Sync all panes},}" a { switch-client -T prefix; send-keys -K a } \
  "Cycle border style"        B { switch-client -T prefix; send-keys -K B } \
  "" \
  "Open scrollback"           v { switch-client -T prefix; send-keys -K v } \
  "Scrollback in Neovim"       e { switch-client -T prefix; send-keys -K e } \
  "System monitor (btop)"      b { switch-client -T prefix; send-keys -K b } \
  "Paste buffers"             P { switch-client -T prefix; send-keys -K P } \
  "" \
  "Reload config"             r { switch-client -T prefix; send-keys -K r } \
  "Command prompt"          ":" { switch-client -T prefix; send-keys -K ":" } \
  "‹ Quick actions"         "?" { run-shell -C "quick-actions" }'
bind-key -N 'Open Quick actions' '?' run-shell -C 'quick-actions'

# Window and session switchers use native formats. Window names lead the search
# results, with session/index included to disambiguate identical project names.
bind-key -N 'Fuzzy switch window' f {
  new-pane -EOACD -B rounded -T 'Switch window' -x '78%' -y '48%'
  move-pane -P centre
  switch-mode -kw -O activity -F '#{q/h:window_name}  ·  #{q/h:session_name}:#{window_index}#{?window_active, ●,}  ·  #{E:@pane-path}#{?#{e|>:#{window_panes},1},  (#{window_panes} panes),}#{?#{E:@window-agent-state},  [#{E:@window-agent-state}],}'
}
bind-key -N 'Fuzzy switch session' F {
  new-pane -EOACD -B rounded -T 'Switch session' -x '66%' -y '40%'
  move-pane -P centre
  switch-mode -ks -O activity -F '#{q/h:session_name}#{?session_attached, ●,}  ·  #{session_windows} windows'
}
bind-key -N 'Fuzzy switch session' BTab {
  switch-client -T prefix
  send-keys -K F
}

# Feed switch-mode via stdin. Double hashes defer expansion to the list/selection
# commands. The first field is a stable target, hidden from the displayed row.
set -g @pane-switch-label '#{window_name}  ·  #{session_name}:#{window_index}.#{pane_index}  ·  #{E:@cwd}#{?pane_program_state,  [#{pane_program_state}],}'
set -g @pane-switch-row '#{session_id}:#{window_id}.#{pane_id}  #{s|[[:cntrl:]]| |:#{E:@pane-switch-label}}'
bind-key -N 'Fuzzy jump to any pane across sessions' "'" {
  new-pane -EOACD -B rounded -T 'Jump to pane' -x '80%' -y '48%'
  move-pane -P centre
  run-shell '
    tmux list-panes -a -f "##{!:##{pane_modal_flag}}" -F "##{E:@pane-switch-row}" |
      tmux switch-mode -k -f - -t #{pane_id} -F "##{q/h;s|^[^ ]+ +||:switch_item}" \
        "run-shell -C \"switch-client -Z -t '\''##{s| .*||:switch_item}'\''\""'
}

bind-key -N 'Fuzzy search key bindings' '/' {
  new-pane -EOACD -B rounded -T 'Key bindings' -x '84%' -y '66%'
  move-pane -P centre
  run-shell '
    {
      tmux list-keys -N
      tmux list-keys -N -T move -P "[move]"
      tmux list-keys -N -T copy-mode-vi -P "[copy]"
    } | tmux switch-mode -k -f - -t #{pane_id} -F "##{q/h:switch_item}" "display-message '\''##{switch_item}'\''"'
}

bind-key -N 'Session tree (modal)' s {
  new-pane -EOACD -B rounded -T 'Sessions' -x '84%' -y '78%'
  move-pane -P centre
  choose-tree -hkZs -O z
}
bind-key -N 'Window tree (modal)' w {
  new-pane -EOACD -B rounded -T 'Windows' -x '84%' -y '78%'
  move-pane -P centre
  choose-tree -hkZw -O z
}

# Keep the sidebar preference with its session across config reloads.
bind-key -N 'Toggle left sidebar' '\' {
  if -F '#{==:#{side-status},off}' {
    set side-status left
  } {
    set side-status off
  }
}

bind-key -N 'Cycle pane border style (joined / separate-active / separate)' B {
  if -F '#{==:#{pane-border-type},joined}' {
    set -g pane-border-type separate-active
  } {
    if -F '#{==:#{pane-border-type},separate-active}' {
      set -g pane-border-type separate
    } {
      set -g pane-border-type joined
    }
  }
  display-message "Pane borders · #{pane-border-type}"
}

bind-key -N 'New window in this directory' c new-window -c "#{pane_current_path}"
bind-key -N 'Open nine windows in this directory' C {
  new-window -c "#{pane_current_path}"
  new-window -c "#{pane_current_path}"
  new-window -c "#{pane_current_path}"
  new-window -c "#{pane_current_path}"
  new-window -c "#{pane_current_path}"
  new-window -c "#{pane_current_path}"
  new-window -c "#{pane_current_path}"
  new-window -c "#{pane_current_path}"
  new-window -c "#{pane_current_path}"
}
# In-pane prompts (-P) keep input right at eye level instead of jumping to the status line.
bind-key -N 'Rename window' R command-prompt -P -I "#W" -p "Rename window:" { rename-window -- "%%" }
bind-key -N 'Open or create a named session' S command-prompt -Pe -p "Session name:" {
  new-session -A -s "%%" -c "#{pane_current_path}"
}
bind-key -N 'Return to last window' Tab last-window
bind-key -r -N 'Previous window' N previous-window
bind-key -r -N 'Move window left' S-Left swap-window -d -t :-1
bind-key -r -N 'Move window right' S-Right swap-window -d -t :+1

# Floating scratchpad, float/dock toggle, btop monitor, and scrollback in Neovim.
bind-key -N 'Floating scratchpad terminal' '`' {
  new-pane -A -B rounded -T 'Scratch' -x '82%' -y '78%' -c "#{pane_current_path}"
  move-pane -P centre
}
bind-key -N 'Toggle floating/tiled pane' t {
  if -F '#{pane_floating_flag}' {
    join-pane
  } {
    if -F '#{!:#{window_zoomed_flag}}' {
      break-pane -W -x '80%' -y '75%'
      move-pane -P centre
    } {
      display-message "Unzoom first to float pane"
    }
  }
}
bind-key -N 'Floating system monitor (btop)' b {
  new-pane -A -B rounded -T 'btop' -x '88%' -y '86%' 'btop || htop || top'
  move-pane -P centre
}
bind-key -N 'Open scrollback in Neovim' e {
  run-shell -C 'new-pane -A -B rounded -T "Scrollback" -x 88% -y 86% -c "##{pane_current_path}" "tmux capture-pane -pJ -S - -t #{pane_id} | nvim -R -n -i NONE -c \"setlocal buftype=nofile bufhidden=wipe nowrap nomodifiable\" -c \"normal! G\" -"'
  move-pane -P centre
}
bind-key -N 'Toggle synchronize-panes' a {
  set-window-option synchronize-panes
  display-message "synchronize-panes: #{?pane_synchronized,on,off}"
}

# Status segments share the keyboard menu and session tree. Open the menu on
# release so the click which opened it cannot select one of its entries.
unbind-key -n MouseDown1StatusRight
bind-key -n -N 'Choose a session' MouseDown1StatusLeft {
  switch-client -T prefix
  send-keys -K s
}
unbind-key -n MouseUp1StatusRight
bind-key -n -N 'Quick actions menu' MouseUp1Control0 run-shell -C 'quick-actions'
unbind-key -n MouseDown2Status
bind-key -n -N 'Confirm close clicked window' MouseUp2Status {
  display-menu -M -C 1 -T ' Close #I:#{q/h;=/26/…:window_name}? ' -t = -x W -y S \
    'Close window' y { kill-window -t '#{window_id}' } \
    'Cancel'       n { }
}
bind-key -n WheelUpStatus previous-window
bind-key -n WheelDownStatus next-window
bind-key -n WheelUpStatusDefault previous-window
bind-key -n WheelDownStatusDefault next-window

# Sidebar control ranges: 1 = close sidebar, 2 = new window.
bind-key -n MouseDown1SideStatusControl1 set side-status off
bind-key -n MouseDown1SideStatusControl2 new-window -c "#{pane_current_path}"

# Alt+digits switch windows; Alt+0 picks window 10.
bind-key -n M-1 select-window -t :=1
bind-key -n M-2 select-window -t :=2
bind-key -n M-3 select-window -t :=3
bind-key -n M-4 select-window -t :=4
bind-key -n M-5 select-window -t :=5
bind-key -n M-6 select-window -t :=6
bind-key -n M-7 select-window -t :=7
bind-key -n M-8 select-window -t :=8
bind-key -n M-9 select-window -t :=9
bind-key -n M-0 select-window -t :=10

# ── Pane layout and navigation ────────────────────────────────────
bind-key -N 'Split top and bottom' '"' split-window -v -c "#{pane_current_path}"
bind-key -N 'Split side by side' '%' split-window -h -c "#{pane_current_path}"
bind-key -N 'Split side by side' '|' split-window -h -c "#{pane_current_path}"
bind-key -N 'Split top and bottom' '-' split-window -v -c "#{pane_current_path}"
bind-key -N 'Close pane immediately' X kill-pane

# Prefix+h/j/k/l also works when the host terminal captures Alt+h/j/k/l.
bind-key -r -N 'Focus pane to the left' h select-pane -L
bind-key -r -N 'Focus pane below' j select-pane -D
bind-key -r -N 'Focus pane above' k select-pane -U
bind-key -r -N 'Focus pane to the right' l select-pane -R
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

bind-key -N 'Swap pane left' H swap-pane -d -t "{left-of}"
bind-key -N 'Swap pane down' J swap-pane -d -t "{down-of}"
bind-key -N 'Swap pane up' K swap-pane -d -t "{up-of}"
bind-key -N 'Swap pane right' L swap-pane -d -t "{right-of}"

# On floating panes -L/-U grow from the far edge, so h/k shrink instead.
bind-key -r C-h if -F '#{pane_floating_flag}' { resize-pane -R -5 } { resize-pane -L 5 }
bind-key -r C-j resize-pane -D 5
bind-key -r C-k if -F '#{pane_floating_flag}' { resize-pane -D -5 } { resize-pane -U 5 }
bind-key -r C-l resize-pane -R 5

# Enhance stock `prefix g` (move table) with vim keys for floating pane snapping.
bind-key -T move c   move-pane -P centre
bind-key -T move f   { resize-pane -x '100%' -y '100%' ; move-pane -P top-left }
bind-key -T move h   move-pane -P centre-left
bind-key -T move j   move-pane -P bottom-centre
bind-key -T move k   move-pane -P top-centre
bind-key -T move l   move-pane -P centre-right
bind-key -T move M-h { resize-pane -x '50%' -y '100%' ; move-pane -P centre-left }
bind-key -T move M-j { resize-pane -x '100%' -y '50%' ; move-pane -P bottom-centre }
bind-key -T move M-k { resize-pane -x '100%' -y '50%' ; move-pane -P top-centre }
bind-key -T move M-l { resize-pane -x '50%' -y '100%' ; move-pane -P centre-right }

# Alt+drag draws a floating pane without leaking Alt+click into the pane or copy-mode.
# A plain border drag moves or resizes the floating pane.
unbind-key -n C-MouseDrag1Pane
unbind-key -n C-MouseDrag1Empty
unbind-key -n M-MouseDrag1Border
unbind-key -n MouseDown1Control1
unbind-key -n MouseDown1Control2
bind-key -n M-MouseDown1Pane    select-pane -t =
bind-key -n M-MouseDrag1Pane    new-pane -M -c "#{pane_current_path}"
bind-key -n M-MouseDrag1Empty   new-pane -M -c "#{pane_current_path}"
bind-key -n M-MouseDragEnd1Pane select-pane -t =
bind-key -T copy-mode-vi M-MouseDown1Pane    select-pane -t =
bind-key -T copy-mode-vi M-MouseDrag1Pane    new-pane -M -c "#{pane_current_path}"
bind-key -T copy-mode-vi M-MouseDragEnd1Pane select-pane -t =

unbind-key Right
unbind-key Up
unbind-key Down
unbind-key Left

# Use the directory to distinguish shell windows. Explicit window names keep tmux's
# native automatic-rename off flag.
set -g @shell-programs '^(bash|zsh|fish|sh|dash|ksh)$'
set -g @shell-active '#{m/r:#{@shell-programs},#{pane_current_command}}'
set -g @cwd '#{s|^#{HOME}$|~|;s|^#{HOME}/|~/|:pane_current_path}'
set -g @short-cwd '#{?#{==:#{pane_current_path},#{HOME}},~,#{?pane_current_path,#{b:pane_current_path},}}'
set -g automatic-rename-format '#{?pane_modal_flag,#{window_name},#{?#{&&:#{E:@shell-active},#{pane_current_path}},#{E:@short-cwd},#{pane_current_command}}#{?pane_dead, [dead],}}'

# Shell line editing, with native Home/End sequences for other programs.
bind-key -n End {
  if -F '#{E:@shell-active}' {
    send-keys C-e
  } {
    send-keys End
  }
}
bind-key -n Home {
  if -F '#{E:@shell-active}' {
    send-keys C-a
  } {
    send-keys Home
  }
}

# ── Clipboard and scrollback ──────────────────────────────────────
# Use the best available WSL clipboard backend each time the file is loaded.
bind-key -N 'Paste from tmux' p paste-buffer -p
bind-key -N 'Choose a tmux buffer (modal)' P {
  if -F '#{buffer_size}' {
    new-pane -EOACD -B rounded -T 'Buffers' -x '80%' -y '72%'
    move-pane -P centre
    choose-buffer -kZ
  } {
    display-message 'No paste buffers'
  }
}
set -su copy-command
if-shell 'command -v win32yank.exe >/dev/null 2>&1' {
  set -s copy-command "win32yank.exe -i --crlf"
  # The sentinel preserves trailing newlines. Use a per-request buffer and the
  # original pane ID, then delete the buffer after bracketed paste.
  bind-key -N 'Paste from Windows clipboard' p {
    run-shell '
      if clipboard=$(win32yank.exe -o --lf 2>/dev/null && printf .); then
        clipboard=${clipboard%.}
        if [ -n "$clipboard" ]; then
          buffer=windows-clipboard-$$
          printf "%s" "$clipboard" |
            tmux load-buffer -b "$buffer" - \; paste-buffer -b "$buffer" -t #{pane_id} -p -d
        fi
      else
        tmux paste-buffer -t #{pane_id} -p
      fi'
  }
} {
  if-shell 'command -v clip.exe >/dev/null 2>&1' {
    set -s copy-command "clip.exe"
  }
}

bind-key -N 'Open scrollback' v copy-mode
bind-key -N 'Copy the last command output (OSC 133)' y {
  if -F '#{&&:#{pane_last_prompt_time},#{!:#{alternate_on}}}' {
    copy-mode
    send-keys -X copy-pipe-output
    send-keys -X cancel
  } {
    display-message "Command output requires OSC 133 shell integration"
  }
}

# Follow new output at the live edge, and hold position further back.
set-hook -g pane-mode-entered {
  if -F '#{==:#{pane_mode},copy-mode}' { send-keys -X refresh-on }
}

# PageUp follows the same application checks as mouse scrolling.
bind-key -n PPage {
  if -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' {
    send-keys PPage
  } {
    copy-mode -eu
  }
}

# Mouse history: scroll the hovered pane without changing keyboard focus.
# Preserve mouse handling in applications and alternate-screen programs.
bind-key -n WheelUpPane {
  if -Ft= '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' {
    send-keys -M
  } {
    copy-mode -e -t=
    send-keys -N 3 -X -t= scroll-up
  }
}
bind-key -T copy-mode-vi WheelUpPane send-keys -N 3 -X -t= scroll-up
bind-key -T copy-mode-vi WheelDownPane {
  send-keys -N 3 -X -t= scroll-down
  # Return to live output only when there is no selection to preserve.
  if -Ft= '#{&&:#{==:#{scroll_position},0},#{!:#{selection_present}}}' {
    send-keys -X -t= cancel
  }
}

# Click clears the highlight; a click at the live edge resumes normal input.
# At older output, keep the scroll position so a new drag starts there.
bind-key -T copy-mode-vi MouseDown1Pane {
  select-pane -t=
  send-keys -X -t= clear-selection
  if -Ft= '#{==:#{scroll_position},0}' { send-keys -X -t= cancel }
}

# Drag release, double click and triple click all copy without jumping back.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X -t= copy-pipe-no-clear
bind-key -T copy-mode-vi DoubleClick1Pane {
  select-pane -t=
  send-keys -X -t= select-word
  send-keys -X -t= copy-pipe-no-clear
}
bind-key -T copy-mode-vi TripleClick1Pane {
  select-pane -t=
  send-keys -X -t= select-line
  send-keys -X -t= copy-pipe-no-clear
}
bind-key -n DoubleClick1Pane {
  select-pane -t=
  if -Ft= '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
    send-keys -M
  } {
    copy-mode -H -t=
    send-keys -X -t= select-word
    send-keys -X -t= copy-pipe-no-clear
  }
}
bind-key -n TripleClick1Pane {
  select-pane -t=
  if -Ft= '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
    send-keys -M
  } {
    copy-mode -H -t=
    send-keys -X -t= select-line
    send-keys -X -t= copy-pipe-no-clear
  }
}

# Ctrl+C copies an existing selection; outside copy mode it still interrupts.
bind-key -T copy-mode-vi C-c if -F '#{selection_present}' {
  send-keys -X copy-pipe-no-clear
} {
  send-keys -X cancel
}
bind-key -T copy-mode-vi C-Home send-keys -X history-top
bind-key -T copy-mode-vi C-End send-keys -X cancel
bind-key -T copy-mode-vi End send-keys -X cancel
bind-key -T copy-mode End send-keys -X cancel

# Vim-ergonomic copy mode: incremental plain & regex search (next-3.9), line numbers.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-line-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi -N 'Search scrollback forward' /   command-prompt -Pi -T search -p "(search down)"       { send-keys -X search-forward-incremental -- "%%" }
bind-key -T copy-mode-vi -N 'Search scrollback backward' '?' command-prompt -Pi -T search -p "(search up)"         { send-keys -X search-backward-incremental -- "%%" }
bind-key -T copy-mode-vi -N 'Search scrollback forward with regex' M-/ command-prompt -Pi -T search -p "(regex search down)" { send-keys -X search-forward-incremental-regex -- "%%" }
bind-key -T copy-mode-vi -N 'Search scrollback backward with regex' M-? command-prompt -Pi -T search -p "(regex search up)"   { send-keys -X search-backward-incremental-regex -- "%%" }
bind-key -T copy-mode-vi -N 'Toggle scrollback line numbers' '#' send-keys -X line-numbers-toggle

# Jump between shell prompts (OSC 133; next-3.9 supports repeat counts like 3[ / 2]).
# Stock M-o selects command output; stock M-e opens selection/output in nvim.
bind-key -T copy-mode-vi [ send-keys -X previous-prompt
bind-key -T copy-mode-vi ] send-keys -X next-prompt
bind-key -T copy-mode-vi R {
  send-keys -X refresh-toggle
  display-message "copy mode: #{?refresh_active,live,frozen}"
}

# Load the palette first so its variables are available when tmux parses the appearance.
source-file ~/.tmux/themes/atelier.conf ~/.tmux/appearance.conf

# ── Session persistence (TPM + tmux-resurrect) ────────────────────
set -g @resurrect-processes "false"
set -g @resurrect-strategy-vim "session"
set -g @resurrect-strategy-nvim "session"
set -g @resurrect-capture-pane-contents "on"

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-resurrect"

# Load plugins in the background so startup and reload do not wait ~90ms for TPM.
if-shell 'test -x "$HOME/.tmux/plugins/tpm/tpm"' {
  run-shell -b "~/.tmux/plugins/tpm/tpm"
}
