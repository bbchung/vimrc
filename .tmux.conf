# ~/.tmux.conf — next-3.9 + Windows Terminal (WSL2)
# Only options that differ from stock next-3.9.
# Prefix: M-a  |  reload: prefix r
#
# WT: unbind Alt+a / Alt+p / Alt+hjkl / Alt+0-9 if they steal focus.
# WT: allow OSC 52 clipboard write if the option exists.
# Shell: OSC 133 prompt marks light up prefix y, copy-mode [ / ] and the
#        border exit-status cue; without them those stay inert.

# ── Server ────────────────────────────────────────────────────────
set -s escape-time 0
set -s focus-events on
set -s extended-keys on
set -s set-clipboard on
set -s history-file "~/.tmux_history"

# Stock xterm* already has clipboard/ccolour/cstyle/focus/title.
# Reset user features on reload, then add RGB/undercurl/etc.
set -su terminal-features
set -as terminal-features ",xterm*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync:overline:osc7:progressbar"
set -as terminal-features ",tmux*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync:overline"
set -as terminal-features ",alacritty*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync"
set -as terminal-features ",kitty*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync"
set -as terminal-features ",wezterm*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync"
set -as terminal-features ",foot*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync"

# WSL → Windows clipboard (copy-pipe* with no command uses this).
if-shell 'command -v win32yank.exe >/dev/null 2>&1' {
  set -s copy-command "win32yank.exe -i --crlf"
} {
  if-shell 'command -v clip.exe >/dev/null 2>&1' {
    set -s copy-command "clip.exe"
  }
}

# ── Session ───────────────────────────────────────────────────────
set -g prefix M-a
unbind-key C-b
bind-key M-a send-prefix

set -g status-keys emacs
set -g allow-passthrough all
set -g base-index 1
set -g pane-base-index 1
set -g history-limit 100000
set -g aggressive-resize on
set -g display-time 2000
set -g display-panes-time 1500
set -g status-position top
set -g detach-on-destroy off
# The first -r repeat gets a relaxed window, later repeats stay snappy.
set -g initial-repeat-time 600
set -g repeat-time 300
set -g set-titles on
set -g pane-border-status top
set -g set-titles-string "#S · #W#{?pane_title, · #{pane_title},}"

# Default update-environment + WT/WSL vars (full replace, reload-safe).
set -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WAYLAND_DISPLAY WINDOWID XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE WT_SESSION WT_PROFILE_ID COLORTERM TERM_PROGRAM WSL_INTEROP WSL_DISTRO_NAME"

# Command prompt uses a thin accent cursor, like a modern input field.
set -g prompt-cursor-style blinking-bar
set -g prompt-cursor-colour "#89bdc9"
set -g prompt-command-cursor-colour "#dfbd86"

# ── Window ────────────────────────────────────────────────────────
# Keep copy-mode keys predictable regardless of the shell's editor setting.
set -g mode-keys vi

# Copy mode keeps reading pane output like native scrollback: the view stays on
# the lines being read and only follows while the cursor sits at the bottom.
# Paused during a selection; copy-mode-vi R toggles it.
set-hook -g pane-mode-entered {
  if -F '#{==:#{pane_mode},copy-mode}' { send-keys -X refresh-on }
}

# Auto-hiding slim scrollbar overlay while scrolling/hovering; does not reflow pane text.
set -g pane-scrollbars auto-hide
set -g pane-scrollbars-timeout 1500
set -g pane-scrollbars-style "fg=#586e7e,bg=#1f252b,width=1,pad=0"

# ── Keybindings ───────────────────────────────────────────────────
bind-key r {
  source-file ~/.tmux.conf
  display-message "reloaded ~/.tmux.conf"
}

bind-key c new-window -c "#{pane_current_path}"
bind-key C new-window -c "#{pane_current_path}" \;\
  new-window -c "#{pane_current_path}" \;\
  new-window -c "#{pane_current_path}" \;\
  new-window -c "#{pane_current_path}" \;\
  new-window -c "#{pane_current_path}" \;\
  new-window -c "#{pane_current_path}" \;\
  new-window -c "#{pane_current_path}" \;\
  new-window -c "#{pane_current_path}" \;\
  new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key %  split-window -h -c "#{pane_current_path}"
bind-key |  split-window -h -c "#{pane_current_path}"
bind-key -  split-window -v -c "#{pane_current_path}"

bind-key v copy-mode
if-shell 'command -v win32yank.exe >/dev/null 2>&1' {
  bind-key p run-shell 'win32yank.exe -o --lf 2>/dev/null | tmux load-buffer -b wt - && tmux paste-buffer -b wt -p -d'
} {
  bind-key p paste-buffer -p
}
bind-key P choose-buffer

# Copy the last command's output (OSC 133) straight to the clipboard.
bind-key y {
  if -F '#{&&:#{pane_last_prompt_time},#{!:#{alternate_on}}}' {
    copy-mode
    send-keys -X copy-pipe-output
    send-keys -X cancel
    display-message "copied last command output"
  } {
    display-message "no OSC 133 command output here"
  }
}

# PageUp follows the same application checks as mouse scrolling.
bind-key -n PPage {
  if -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' {
    send-keys PPage
  } {
    copy-mode -eu
  }
}

# Mouse history: scroll the hovered pane without changing keyboard focus.
# Preserve mouse handling in applications and alternate-screen programs.
bind-key -n WheelUpPane {
  if -Ft= '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' {
    send-keys -M
  } {
    copy-mode -e -t=
    send-keys -N 3 -X -t= scroll-up
  }
}
bind-key -T copy-mode-vi WheelUpPane send-keys -N 3 -X -t= scroll-up
bind-key -T copy-mode-vi WheelDownPane {
  send-keys -N 3 -X -t= scroll-down
  # Return to live output only when there is no selection to preserve.
  if -Ft= '#{&&:#{==:#{scroll_position},0},#{!:#{selection_present}}}' {
    send-keys -X -t= cancel
  }
}

# Click clears the highlight; a click at the live edge resumes normal input.
# At older output, keep the scroll position so a new drag starts there.
bind-key -T copy-mode-vi MouseDown1Pane {
  select-pane -t=
  send-keys -X -t= clear-selection
  if -Ft= '#{==:#{scroll_position},0}' { send-keys -X -t= cancel }
}

# Drag release, double click and triple click all copy without jumping back.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X -t= copy-pipe-no-clear
bind-key -T copy-mode-vi DoubleClick1Pane {
  select-pane -t=
  send-keys -X -t= select-word
  send-keys -X -t= copy-pipe-no-clear
}
bind-key -T copy-mode-vi TripleClick1Pane {
  select-pane -t=
  send-keys -X -t= select-line
  send-keys -X -t= copy-pipe-no-clear
}
bind-key -n DoubleClick1Pane {
  select-pane -t=
  if -Ft= '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
    send-keys -M
  } {
    copy-mode -H -t=
    send-keys -X -t= select-word
    send-keys -X -t= copy-pipe-no-clear
  }
}
bind-key -n TripleClick1Pane {
  select-pane -t=
  if -Ft= '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
    send-keys -M
  } {
    copy-mode -H -t=
    send-keys -X -t= select-line
    send-keys -X -t= copy-pipe-no-clear
  }
}

# Ctrl+C copies an existing selection; outside copy mode it still interrupts.
bind-key -T copy-mode-vi C-c if -F '#{selection_present}' {
  send-keys -X copy-pipe-no-clear
} {
  send-keys -X cancel
}
bind-key -T copy-mode-vi C-Home send-keys -X history-top
bind-key -T copy-mode-vi C-End send-keys -X cancel
bind-key -T copy-mode-vi End send-keys -X cancel
bind-key -T copy-mode End send-keys -X cancel

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Jump between shell prompts (OSC 133); stock M-o selects that command's output.
bind-key -T copy-mode-vi [ send-keys -X previous-prompt
bind-key -T copy-mode-vi ] send-keys -X next-prompt
bind-key -T copy-mode-vi R {
  send-keys -X refresh-toggle
  display-message "copy mode: #{?refresh_active,live,frozen}"
}

unbind-key L
bind-key H swap-pane -d -t "{left-of}"
bind-key J swap-pane -d -t "{down-of}"
bind-key K swap-pane -d -t "{up-of}"
bind-key L swap-pane -d -t "{right-of}"

# On floating panes -L/-U grow from the far edge, so h/k shrink instead.
bind-key -r C-h if -F '#{pane_floating_flag}' { resize-pane -R -5 } { resize-pane -L 5 }
bind-key -r C-j resize-pane -D 5
bind-key -r C-k if -F '#{pane_floating_flag}' { resize-pane -D -5 } { resize-pane -U 5 }
bind-key -r C-l resize-pane -R 5

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-0 select-window -t 10

bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Create floating pane: Alt+drag (stock is Ctrl+drag). Plain border drag still
# moves/resizes floating panes via MouseDrag1Border → resize-pane -M.
unbind-key -n C-MouseDrag1Pane
unbind-key -n C-MouseDrag1Empty
unbind-key -n M-MouseDrag1Pane
unbind-key -n M-MouseDrag1Border
bind-key -n M-MouseDrag1Pane  new-pane -M -c "#{pane_current_path}"
bind-key -n M-MouseDrag1Empty new-pane -M -c "#{pane_current_path}"

unbind-key Right
unbind-key Up
unbind-key Down
unbind-key Left

# Readline-style C-a/C-e for shells and TUIs; editors and pagers get the real
# keys (C-a in vim would increment a number).
bind-key -n End {
  if -F '#{m/r:^(n?vim?|less|man|nano|micro|hx|emacs)$,#{pane_current_command}}' {
    send-keys End
  } {
    send-keys C-e
  }
}
bind-key -n Home {
  if -F '#{m/r:^(n?vim?|less|man|nano|micro|hx|emacs)$,#{pane_current_command}}' {
    send-keys Home
  } {
    send-keys C-a
  }
}

# bind-key s set-window-option synchronize-panes \; \
#   display-message "synchronize-panes: #{?pane_synchronized,on,off}"

bind-key Tab last-window
bind-key X kill-pane
bind-key S command-prompt -e -p "session name:" { new-session -A -s '%%' }

# Fuzzy window switcher in a bottom floating pane (stock prefix Tab, which is
# last-window here). Stock prefix S-Tab is the same switcher for sessions.
bind-key f {
  new-pane -E -X 0 -Y 0 -x "75%" -y "30%"
  move-pane -P bottom-centre
  switch-mode -kw
}

# ── Appearance (Midnight Mineral) ─────────────────────────────────
# Quiet charcoal surfaces, mineral-blue focus, warm amber for manual names.
# bg: #181c21  surface: #242b32  elevated: #303b45  border: #394650
# dim: #596773  muted: #91a0ab  text: #e1e7eb  accent: #89bdc9  gold: #dfbd86

# Built-in modes (clock, display-panes, tree/customize, switch, copy-mode marks
# and line numbers, fill) draw with theme* colours; map the dark set to match.
set -s dark-theme-black      "#181c21"
set -s dark-theme-dark-grey  "#242b32"
set -s dark-theme-light-grey "#91a0ab"
set -s dark-theme-white      "#e1e7eb"
set -s dark-theme-blue       "#89bdc9"
set -s dark-theme-yellow     "#dfbd86"
set -s dark-theme-red        "#c98276"
set -s dark-theme-green      "#9dc28c"
set -s dark-theme-cyan       "#83c0b6"
set -s dark-theme-magenta    "#b99bc8"

# Editor-style deep selection in copy mode; crisp badges for position & matches.
set -g mode-style "fg=#181c21,bg=#89bdc9,bold"
set -g copy-mode-selection-style "fg=#eaf0f6,bg=#2e4354"
set -g copy-mode-position-style "fg=#e1e7eb,bg=#2c3b4a,bold"
set -g copy-mode-match-style "fg=#e1e7eb,bg=#32414f"
set -g copy-mode-current-match-style "fg=#181c21,bg=#89bdc9,bold"
set -g copy-mode-current-line-style "bg=#242b32"
set -g switch-mode-match-style "fg=#89bdc9,bold"
set -g tree-mode-border-style "fg=#394650,bg=default"
set -g display-panes-border-style "fg=#394650,bg=#242b32"

# Prompts, menus and popups share the same elevated surface.
set -g message-style "fg=#e1e7eb,bg=#242b32,fill=#242b32"
set -g message-command-style "fg=#89bdc9,bg=#242b32,fill=#242b32"
set -g menu-style "fg=#e1e7eb,bg=#242b32"
set -g menu-selected-style "fg=#181c21,bg=#89bdc9,bold"
set -g menu-border-style "fg=#3a4552,bg=#242b32"
set -g menu-border-lines rounded

# Rounded pane borders; quiet inactive hairlines, subtle active focus.
set -g pane-border-lines rounded
set -g pane-border-style "fg=#35414a"
set -g pane-active-border-style "fg=#78a9b5"
# Shells show their directory (editor titles go stale after exit); other
# programs show their own title, or their name while the title is the host.
set -g @pane-label "#{?#{m/r:^(bash|zsh|fish|sh|dash)$,#{pane_current_command}},#{s|^#{HOME}|~|:pane_current_path},#{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}}}"
# Last OSC 133 command once it finishes: ✘ exit code on failure, time if ≥ 5s.
# The marks do not redraw borders by themselves, so refresh on each of them.
set-hook -g pane-shell-prompt "refresh-client -S"
set-hook -g pane-command-started "refresh-client -S"
set -g @pane-cmd "#{?#{&&:#{pane_last_prompt_time},#{!:#{pane_command_running}}},#{?pane_command_status, #[fg=#{?pane_active,#c98276,#9c6860}]✘ #{pane_command_status},}#{?#{e|>=:#{pane_command_duration},5}, #[fg=#{?pane_active,#8492a0,#5c6773}]#{?#{e|>=:#{pane_command_duration},60},#{e|/:#{pane_command_duration},60}m#{e|m:#{pane_command_duration},60}s,#{pane_command_duration}s},},}"
# Split style attributes inside conditionals: commas separate their branches.
set -g pane-border-format "#[align=centre]#{?pane_active,#[fg=#a8bacb]#[bg=#242b32],#[fg=#66727f]#[bg=default]} #P · #{=40:#{E:@pane-label}}#{E:@pane-cmd} #[default]#{?#{mouse},#[align=right]#[range=control|7]#{?pane_active,#{?#{pane_floating_flag},#[fg=#76a39b],#[fg=#596773]},#[fg=#363e47]} #{?#{pane_floating_flag},󰖲,󰕰} #[norange]#[range=control|8]#{?pane_active,#{?#{window_zoomed_flag},#[fg=#bfa475],#[fg=#596773]},#[fg=#363e47]} #{?#{window_zoomed_flag},󰊔,󰊓} #[norange]#[range=control|9]#{?pane_active,#[fg=#596773],#[fg=#363e47]} 󰅖 #[norange],}"

# One line at the top, with a small session badge and softly filled active tab.
set -g status-interval 5
set -g status-style "bg=#181c21,fg=#91a0ab"
set -g status-left-length 28
set -g status-right-length 64
set -g window-status-separator " "

# The badge lights up blue while the prefix key waits for a command, and deep
# slate-blue while the active pane is in copy or choose mode.
set -g status-left "#{?client_prefix,#[fg=#181c21]#[bg=#89bdc9],#{?pane_in_mode,#[fg=#e6edf5]#[bg=#324658],#[fg=#c6d8dc]#[bg=#29363c]}}#[bold] #{=20:session_name} #[default]  "

# Hide the date below 120 columns and the path below 90, leaving room for tabs.
set -g status-right "#{?#{e|>=:#{client_width},90},#[fg=#93a1b0]#{=24:#{b:pane_current_path}}#[fg=#434d58]  ·  ,}#{?#{e|>=:#{client_width},120},#[fg=#6c7885]%Y-%m-%d#[fg=#434d58]  ·  ,}#[fg=#e1e7eb]#[bold]%H:%M#[default] "

# Warm bronze pill + bright amber/cream text for bell alerts; warm sand for manual names.
set -g window-status-style "fg=#91a0ab,bg=default,none"
set -g window-status-last-style "fg=#8e9baa,bg=default"
set -g window-status-current-style "fg=#f0f5f6,bg=#33434c,bold,nounderscore"
set -g window-status-format " #{?#{||:#{window_bell_flag},#{window_activity_flag}},#[fg=#f0b965]#I #[fg=#f7ead2]#W,#{?automatic-rename,#[fg=#657783]#I #[fg=#a0aeb8]#W,#[fg=#a89984]#I #[fg=#bdae93]#W}} "
set -g window-status-current-format " #{?automatic-rename,#[fg=#a3d5df]#I #[fg=#f0f5f6]#W,#[fg=#e2c28f]#I #[fg=#f2e7d5]#W}#{?window_zoomed_flag, #[fg=#89bdc9]󰊔,} "
set -g window-status-activity-style "bg=#2d2620,bold"
set -g window-status-bell-style "bg=#3a2d24,bold"

# ── Plugins (TPM) ─────────────────────────────────────────────────
set -g @resurrect-processes "false"
set -g @resurrect-strategy-vim "session"
set -g @resurrect-strategy-nvim "session"
set -g @resurrect-capture-pane-contents "on"

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-resurrect"
 

run-shell "~/.tmux/plugins/tpm/tpm"
