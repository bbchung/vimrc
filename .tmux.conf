# tmux next-3.9 (58a830277) · WSL2 / Windows Terminal
# Prefix: Alt+a · Quick actions: Alt+a ? · Reload: Alt+a r
# Fuzzy (switch-mode): Alt+a f (window) · F (session) · ' (pane) · / (keys)
# Floating & view: Alt+a ` (scratch) · t (float/dock) · g (snap) · B (border) · \ (sidebar)
# Native themes, floating panes, fuzzy switch-mode, OSC 133/7501/9;4 and vi copy mode.

# ── Terminal and server ───────────────────────────────────────────
set -s default-terminal tmux-256color
set -s editor nvim
set -s escape-time 0
set -s focus-events on
set -s extended-keys on
set -s set-clipboard on
set -s history-file "~/.tmux_history"

# Rebuild terminal features on reload (incl. next-3.9 sixel cache & kittygraphics/imagescroll).
set -su terminal-features
set -as terminal-features ",xterm*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync:overline:osc7:progressbar:sixel"
set -as terminal-features ",tmux*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync:overline:sixel"
set -as terminal-features ",kitty*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync:overline:osc7:progressbar:kittygraphics:imagescroll"
set -as terminal-features ",ghostty*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync:overline:osc7:progressbar:kittygraphics:imagescroll"
set -as terminal-features ",wezterm*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync:overline:osc7:progressbar:sixel"
set -as terminal-features ",alacritty*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync:osc7"
set -as terminal-features ",foot*:RGB:hyperlinks:usstyle:strikethrough:extkeys:sync:osc7:sixel"

set -g mouse on
set -g allow-passthrough all
set -g detach-on-destroy off
set -g aggressive-resize on
set -g base-index 1
set -g pane-base-index 1
set -g history-limit 100000
set -g display-time 2000
set -g display-panes-time 2000
set -g initial-repeat-time 600
set -g repeat-time 300
set -g status-keys emacs
set -g mode-keys vi
set -g copy-mode-keep-column on
set -g set-titles on
set -g set-titles-string "#S · #W#{?pane_title, · #{pane_title},}"
set -g monitor-bell on
set -g visual-bell off

# Refresh Windows Terminal and WSL variables alongside tmux's defaults.
set -gu update-environment
set -ag update-environment "WT_SESSION WT_PROFILE_ID COLORTERM TERM_PROGRAM WSL_INTEROP WSL_DISTRO_NAME"

# Clean up legacy user options on reload.
set -gu @status-session-style
set -gu @session-pill
set -gu @pane-index
set -gu @status-mode
set -gu @status-context
set -gu @status-hint
set -gu @tab-columns
set -gu @tab-room
set -gu @inactive-window-name
set -gu @active-name-room
set -gu @active-window-name
set -gu @window-name
set -gu @window-name-width
set -gu @pane-label-raw
set -gu @pane-detail-format
set -gu @pane-caption-format
set -gu @pane-border-draw

# ── Adaptive Atelier Palette (Obsidian Dark / Paper Light) ────────
# Four-step surface elevation calibrated to VS Code Dark Modern (#1f1f1f)
# and Paper Light (#ffffff): bar -> base -> menu/surface -> pill.
%hidden tmux_bar="#{?#{==:#{client_active_theme},light},#eceff3,#15171a}"
%hidden tmux_base="#{?#{==:#{client_active_theme},light},#ffffff,#1f1f1f}"
%hidden tmux_menu="#{?#{==:#{client_active_theme},light},#f7f8fa,#21252c}"
%hidden tmux_surface="#{?#{==:#{client_active_theme},light},#ffffff,#252931}"
%hidden tmux_pill="#{?#{==:#{client_active_theme},light},#dfe5ee,#2d333f}"
%hidden tmux_selection="#{?#{==:#{client_active_theme},light},#bddbff,#264a73}"
%hidden tmux_divider="#{?#{==:#{client_active_theme},light},#c8d0dc,#3a414f}"
%hidden tmux_border="#{?#{==:#{client_active_theme},light},#d0d7e2,#333945}"
%hidden tmux_pane_focus="#{?#{==:#{client_active_theme},light},#5b8ec9,#4a6d94}"
%hidden tmux_pane_badge="#{?#{==:#{client_active_theme},light},#dce9f7,#233347}"
%hidden tmux_focus="#{?#{==:#{client_active_theme},light},#2b7bd6,#5c8ec9}"
%hidden tmux_inactive="#{?#{==:#{client_active_theme},light},#8b949e,#636c7d}"
%hidden tmux_muted="#{?#{==:#{client_active_theme},light},#5e6773,#8e97a8}"
%hidden tmux_subtext="#{?#{==:#{client_active_theme},light},#363d47,#bcc4d4}"
%hidden tmux_text="#{?#{==:#{client_active_theme},light},#1c2128,#e8ecf2}"
%hidden tmux_accent="#{?#{==:#{client_active_theme},light},#0969da,#74b9ff}"
%hidden tmux_cyan="#{?#{==:#{client_active_theme},light},#0b7d7c,#6fd6cf}"
%hidden tmux_green="#{?#{==:#{client_active_theme},light},#1f883d,#7fd68a}"
%hidden tmux_gold="#{?#{==:#{client_active_theme},light},#9a6700,#e8c47a}"
%hidden tmux_magenta="#{?#{==:#{client_active_theme},light},#8250df,#c89df2}"
%hidden tmux_error="#{?#{==:#{client_active_theme},light},#cf222e,#f27d72}"

# Native next-3.9 theme detection + dark/light palettes for built-in modes.
set -s theme detect
set -s dark-theme-black       "#1f1f1f"
set -s dark-theme-dark-grey   "#21252c"
set -s dark-theme-light-grey  "#8e97a8"
set -s dark-theme-white       "#e8ecf2"
set -s dark-theme-blue        "#74b9ff"
set -s dark-theme-cyan        "#6fd6cf"
set -s dark-theme-green       "#7fd68a"
set -s dark-theme-yellow      "#e8c47a"
set -s dark-theme-magenta     "#c89df2"
set -s dark-theme-red         "#f27d72"

set -s light-theme-black      "#ffffff"
set -s light-theme-dark-grey  "#f7f8fa"
set -s light-theme-light-grey "#5e6773"
set -s light-theme-white      "#1c2128"
set -s light-theme-blue       "#0969da"
set -s light-theme-cyan       "#0b7d7c"
set -s light-theme-green      "#1f883d"
set -s light-theme-yellow     "#9a6700"
set -s light-theme-magenta    "#8250df"
set -s light-theme-red        "#cf222e"

# ── Workspace and Quick actions ──────────────────────────────────
set -g prefix M-a
unbind-key C-b
bind-key -N 'Send Alt+a to the pane' M-a send-prefix
bind-key -N 'Reload ~/.tmux.conf' r {
  source-file ~/.tmux.conf
  display-message "Reloaded ~/.tmux.conf"
}

# Menus use the same actions as the prefix table. Parse the aliases when opened.
# Keyboard opens in the centre. The status click opens below the right segment.
set -s 'command-alias[quick-actions]' 'quick-actions=display-menu -M -T "#[align=centre fg=themeblue bold] ◈ Quick actions " \
  -x "#{?mouse_absolute_x,#{e|-:#{window_width},#{popup_width}},#{popup_centre_x}}" \
  -y "#{?mouse_absolute_x,#{popup_status_line_y},#{popup_centre_y}}" \
  "Switch window"             f { switch-client -T prefix; send-keys -K f } \
  "Switch session"            F { switch-client -T prefix; send-keys -K F } \
  "Jump to pane"          "\047" { switch-client -T prefix; send-keys -K "\047" } \
  "#{?#{==:#{side-status},off},Show sidebar,Hide sidebar}" "\134" { switch-client -T prefix; send-keys -K "\134" } \
  "" \
  "New window"                c { switch-client -T prefix; send-keys -K c } \
  "Split side by side"      "|" { switch-client -T prefix; send-keys -K "|" } \
  "Split top and bottom"    "-" { switch-client -T prefix; send-keys -K "-" } \
  "Floating scratchpad"     "`" { switch-client -T prefix; send-keys -K "`" } \
  "" \
  "Search key bindings"     "/" { switch-client -T prefix; send-keys -K "/" } \
  "More actions ›"            m { run-shell -C "quick-actions-more" }'
set -s 'command-alias[quick-actions-more]' 'quick-actions-more=display-menu -M -x L -y L -T "#[align=centre fg=themeblue bold] ◈ More actions " \
  "Session tree"              s { switch-client -T prefix; send-keys -K s } \
  "Window tree"               w { switch-client -T prefix; send-keys -K w } \
  "" \
  "#{?pane_floating_flag,Dock pane,#{?window_zoomed_flag,,Float pane}}" t { switch-client -T prefix; send-keys -K t } \
  "#{?#{e|>:#{window_panes},1},#{?window_zoomed_flag,Unzoom pane,Zoom pane},}" z { switch-client -T prefix; send-keys -K z } \
  "#{?#{e|>:#{window_panes},1},Equalize panes,}" E { switch-client -T prefix; send-keys -K E } \
  "#{?#{e|>:#{window_panes},1},#{?pane_synchronized,Disable pane sync,Sync all panes},}" a { switch-client -T prefix; send-keys -K a } \
  "Cycle border style"        B { switch-client -T prefix; send-keys -K B } \
  "" \
  "Open scrollback"           v { switch-client -T prefix; send-keys -K v } \
  "Scrollback in Neovim"       e { switch-client -T prefix; send-keys -K e } \
  "System monitor (btop)"      b { switch-client -T prefix; send-keys -K b } \
  "Paste buffers"             P { switch-client -T prefix; send-keys -K P } \
  "" \
  "Reload config"             r { switch-client -T prefix; send-keys -K r } \
  "Command prompt"          ":" { switch-client -T prefix; send-keys -K ":" } \
  "‹ Quick actions"         "?" { run-shell -C "quick-actions" }'
bind-key -N 'Open Quick actions' '?' run-shell -C 'quick-actions'

# Window and session switchers use native formats. Window names lead the search
# results, with session/index included to disambiguate identical project names.
bind-key -N 'Fuzzy switch window' f {
  new-pane -EOACD -B rounded -T 'Switch window' -x '78%' -y '48%'
  move-pane -P centre
  switch-mode -kw -O activity -F '#{q/h:window_name}  ·  #{q/h:session_name}:#{window_index}#{?window_active, ●,}  ·  #{E:@pane-path}#{?#{e|>:#{window_panes},1},  (#{window_panes} panes),}#{?#{E:@window-agent-state},  [#{E:@window-agent-state}],}'
}
bind-key -N 'Fuzzy switch session' F {
  new-pane -EOACD -B rounded -T 'Switch session' -x '66%' -y '40%'
  move-pane -P centre
  switch-mode -ks -O activity -F '#{q/h:session_name}#{?session_attached, ●,}  ·  #{session_windows} windows'
}
bind-key -N 'Fuzzy switch session' BTab {
  switch-client -T prefix
  send-keys -K F
}

# Feed switch-mode via stdin. Double hashes defer expansion to the list/selection
# commands. The first field is a stable target, hidden from the displayed row.
set -g @pane-switch-label '#{window_name}  ·  #{session_name}:#{window_index}.#{pane_index}  ·  #{E:@cwd}#{?pane_program_state,  [#{pane_program_state}],}'
set -g @pane-switch-row '#{session_id}:#{window_id}.#{pane_id}  #{s|[[:cntrl:]]| |:#{E:@pane-switch-label}}'
bind-key -N 'Fuzzy jump to any pane across sessions' "'" {
  new-pane -EOACD -B rounded -T 'Jump to pane' -x '80%' -y '48%'
  move-pane -P centre
  run-shell '
    tmux list-panes -a -f "##{!:##{pane_modal_flag}}" -F "##{E:@pane-switch-row}" |
      tmux switch-mode -k -f - -t #{pane_id} -F "##{q/h;s|^[^ ]+ +||:switch_item}" \
        "run-shell -C \"switch-client -Z -t '\''##{s| .*||:switch_item}'\''\""'
}

bind-key -N 'Fuzzy search key bindings' '/' {
  new-pane -EOACD -B rounded -T 'Key bindings' -x '84%' -y '66%'
  move-pane -P centre
  run-shell '
    {
      tmux list-keys -N
      tmux list-keys -N -T move -P "[move]"
      tmux list-keys -N -T copy-mode-vi -P "[copy]"
    } | tmux switch-mode -k -f - -t #{pane_id} -F "##{q/h:switch_item}" "display-message '\''##{switch_item}'\''"'
}

bind-key -N 'Session tree (modal)' s {
  new-pane -EOACD -B rounded -T 'Sessions' -x '84%' -y '78%'
  move-pane -P centre
  choose-tree -hkZs -O z
}
bind-key -N 'Window tree (modal)' w {
  new-pane -EOACD -B rounded -T 'Windows' -x '84%' -y '78%'
  move-pane -P centre
  choose-tree -hkZw -O z
}

# Keep the sidebar preference with its session across config reloads.
bind-key -N 'Toggle left sidebar' '\' {
  if -F '#{==:#{side-status},off}' {
    set side-status left
  } {
    set side-status off
  }
}

bind-key -N 'Cycle pane border style (joined / separate-active / separate)' B {
  if -F '#{==:#{pane-border-type},joined}' {
    set -g pane-border-type separate-active
  } {
    if -F '#{==:#{pane-border-type},separate-active}' {
      set -g pane-border-type separate
    } {
      set -g pane-border-type joined
    }
  }
  display-message "Pane borders · #{pane-border-type}"
}

bind-key -N 'New window in this directory' c new-window -c "#{pane_current_path}"
bind-key -N 'Open nine windows in this directory' C {
  new-window -c "#{pane_current_path}"
  new-window -c "#{pane_current_path}"
  new-window -c "#{pane_current_path}"
  new-window -c "#{pane_current_path}"
  new-window -c "#{pane_current_path}"
  new-window -c "#{pane_current_path}"
  new-window -c "#{pane_current_path}"
  new-window -c "#{pane_current_path}"
  new-window -c "#{pane_current_path}"
}
# In-pane prompts (-P) keep input right at eye level instead of jumping to the status line.
bind-key -N 'Rename window' R command-prompt -P -I "#W" -p "Rename window:" { rename-window -- "%%" }
bind-key -N 'Open or create a named session' S command-prompt -Pe -p "Session name:" {
  new-session -A -s "%%" -c "#{pane_current_path}"
}
bind-key -N 'Return to last window' Tab last-window
bind-key -r -N 'Previous window' N previous-window
bind-key -r -N 'Move window left' S-Left swap-window -d -t :-1
bind-key -r -N 'Move window right' S-Right swap-window -d -t :+1

# Floating scratchpad, float/dock toggle, btop monitor, and scrollback in Neovim.
bind-key -N 'Floating scratchpad terminal' '`' {
  new-pane -A -B rounded -T 'Scratch' -x '82%' -y '78%' -c "#{pane_current_path}"
  move-pane -P centre
}
bind-key -N 'Toggle floating/tiled pane' t {
  if -F '#{pane_floating_flag}' {
    join-pane
  } {
    if -F '#{!:#{window_zoomed_flag}}' {
      break-pane -W -x '80%' -y '75%'
      move-pane -P centre
    } {
      display-message "Unzoom first to float pane"
    }
  }
}
bind-key -N 'Floating system monitor (btop)' b {
  new-pane -A -B rounded -T 'btop' -x '88%' -y '86%' 'btop || htop || top'
  move-pane -P centre
}
bind-key -N 'Open scrollback in Neovim' e {
  run-shell -C 'new-pane -A -B rounded -T "Scrollback" -x 88% -y 86% -c "##{pane_current_path}" "tmux capture-pane -pJ -S - -t #{pane_id} | nvim -R -n -i NONE -c \"setlocal buftype=nofile bufhidden=wipe nowrap nomodifiable\" -c \"normal! G\" -"'
  move-pane -P centre
}
bind-key -N 'Toggle synchronize-panes' a {
  set-window-option synchronize-panes
  display-message "synchronize-panes: #{?pane_synchronized,on,off}"
}

# Status segments share the keyboard menu and session tree. Open the menu on
# release so the click which opened it cannot select one of its entries.
unbind-key -n MouseDown1StatusRight
bind-key -n -N 'Choose a session' MouseDown1StatusLeft {
  switch-client -T prefix
  send-keys -K s
}
unbind-key -n MouseUp1StatusRight
bind-key -n -N 'Quick actions menu' MouseUp1Control0 run-shell -C 'quick-actions'
unbind-key -n MouseDown2Status
bind-key -n -N 'Confirm close clicked window' MouseUp2Status {
  display-menu -M -C 1 -T ' Close #I:#{q/h;=/26/…:window_name}? ' -t = -x W -y S \
    'Close window' y { kill-window -t '#{window_id}' } \
    'Cancel'       n { }
}
bind-key -n WheelUpStatus previous-window
bind-key -n WheelDownStatus next-window
bind-key -n WheelUpStatusDefault previous-window
bind-key -n WheelDownStatusDefault next-window

# Sidebar control ranges: 1 = close sidebar, 2 = new window.
bind-key -n MouseDown1SideStatusControl1 set side-status off
bind-key -n MouseDown1SideStatusControl2 new-window -c "#{pane_current_path}"

# Alt+digits switch windows; Alt+0 picks window 10.
bind-key -n M-1 select-window -t :=1
bind-key -n M-2 select-window -t :=2
bind-key -n M-3 select-window -t :=3
bind-key -n M-4 select-window -t :=4
bind-key -n M-5 select-window -t :=5
bind-key -n M-6 select-window -t :=6
bind-key -n M-7 select-window -t :=7
bind-key -n M-8 select-window -t :=8
bind-key -n M-9 select-window -t :=9
bind-key -n M-0 select-window -t :=10

# ── Pane layout and navigation ────────────────────────────────────
bind-key -N 'Split top and bottom' '"' split-window -v -c "#{pane_current_path}"
bind-key -N 'Split side by side' '%' split-window -h -c "#{pane_current_path}"
bind-key -N 'Split side by side' '|' split-window -h -c "#{pane_current_path}"
bind-key -N 'Split top and bottom' '-' split-window -v -c "#{pane_current_path}"
bind-key -N 'Close pane immediately' X kill-pane

# Prefix+h/j/k/l also works when the host terminal captures Alt+h/j/k/l.
bind-key -r -N 'Focus pane to the left' h select-pane -L
bind-key -r -N 'Focus pane below' j select-pane -D
bind-key -r -N 'Focus pane above' k select-pane -U
bind-key -r -N 'Focus pane to the right' l select-pane -R
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

bind-key -N 'Swap pane left' H swap-pane -d -t "{left-of}"
bind-key -N 'Swap pane down' J swap-pane -d -t "{down-of}"
bind-key -N 'Swap pane up' K swap-pane -d -t "{up-of}"
bind-key -N 'Swap pane right' L swap-pane -d -t "{right-of}"

# On floating panes -L/-U grow from the far edge, so h/k shrink instead.
bind-key -r C-h if -F '#{pane_floating_flag}' { resize-pane -R -5 } { resize-pane -L 5 }
bind-key -r C-j resize-pane -D 5
bind-key -r C-k if -F '#{pane_floating_flag}' { resize-pane -D -5 } { resize-pane -U 5 }
bind-key -r C-l resize-pane -R 5

# Enhance stock `prefix g` (move table) with vim keys for floating pane snapping.
bind-key -T move c   move-pane -P centre
bind-key -T move f   { resize-pane -x '100%' -y '100%' ; move-pane -P top-left }
bind-key -T move h   move-pane -P centre-left
bind-key -T move j   move-pane -P bottom-centre
bind-key -T move k   move-pane -P top-centre
bind-key -T move l   move-pane -P centre-right
bind-key -T move M-h { resize-pane -x '50%' -y '100%' ; move-pane -P centre-left }
bind-key -T move M-j { resize-pane -x '100%' -y '50%' ; move-pane -P bottom-centre }
bind-key -T move M-k { resize-pane -x '100%' -y '50%' ; move-pane -P top-centre }
bind-key -T move M-l { resize-pane -x '50%' -y '100%' ; move-pane -P centre-right }

# Alt+drag draws a floating pane without leaking Alt+click into the pane or copy-mode.
# A plain border drag moves or resizes the floating pane.
unbind-key -n C-MouseDrag1Pane
unbind-key -n C-MouseDrag1Empty
unbind-key -n M-MouseDrag1Border
unbind-key -n MouseDown1Control1
unbind-key -n MouseDown1Control2
bind-key -n M-MouseDown1Pane    select-pane -t =
bind-key -n M-MouseDrag1Pane    new-pane -M -c "#{pane_current_path}"
bind-key -n M-MouseDrag1Empty   new-pane -M -c "#{pane_current_path}"
bind-key -n M-MouseDragEnd1Pane select-pane -t =
bind-key -T copy-mode-vi M-MouseDown1Pane    select-pane -t =
bind-key -T copy-mode-vi M-MouseDrag1Pane    new-pane -M -c "#{pane_current_path}"
bind-key -T copy-mode-vi M-MouseDragEnd1Pane select-pane -t =

unbind-key Right
unbind-key Up
unbind-key Down
unbind-key Left

# Use the directory to distinguish shell windows. Explicit window names keep tmux's
# native automatic-rename off flag.
set -g @shell-programs '^(bash|zsh|fish|sh|dash|ksh)$'
set -g @shell-active '#{m/r:#{@shell-programs},#{pane_current_command}}'
set -g @cwd '#{s|^#{HOME}$|~|;s|^#{HOME}/|~/|:pane_current_path}'
set -g @short-cwd '#{?#{==:#{pane_current_path},#{HOME}},~,#{?pane_current_path,#{b:pane_current_path},}}'
set -g automatic-rename-format '#{?pane_modal_flag,#{window_name},#{?#{&&:#{E:@shell-active},#{pane_current_path}},#{E:@short-cwd},#{pane_current_command}}#{?pane_dead, [dead],}}'

# Shell line editing, with native Home/End sequences for other programs.
bind-key -n End {
  if -F '#{E:@shell-active}' {
    send-keys C-e
  } {
    send-keys End
  }
}
bind-key -n Home {
  if -F '#{E:@shell-active}' {
    send-keys C-a
  } {
    send-keys Home
  }
}

# ── Clipboard and scrollback ──────────────────────────────────────
# Use the best available WSL clipboard backend each time the file is loaded.
bind-key -N 'Paste from tmux' p paste-buffer -p
bind-key -N 'Choose a tmux buffer (modal)' P {
  if -F '#{buffer_size}' {
    new-pane -EOACD -B rounded -T 'Buffers' -x '80%' -y '72%'
    move-pane -P centre
    choose-buffer -kZ
  } {
    display-message 'No paste buffers'
  }
}
set -su copy-command
if-shell 'command -v win32yank.exe >/dev/null 2>&1' {
  set -s copy-command "win32yank.exe -i --crlf"
  # The sentinel preserves trailing newlines. Use a per-request buffer and the
  # original pane ID, then delete the buffer after bracketed paste.
  bind-key -N 'Paste from Windows clipboard' p {
    run-shell '
      if clipboard=$(win32yank.exe -o --lf 2>/dev/null && printf .); then
        clipboard=${clipboard%.}
        if [ -n "$clipboard" ]; then
          buffer=windows-clipboard-$$
          printf "%s" "$clipboard" |
            tmux load-buffer -b "$buffer" - \; paste-buffer -b "$buffer" -t #{pane_id} -p -d
        fi
      else
        tmux paste-buffer -t #{pane_id} -p
      fi'
  }
} {
  if-shell 'command -v clip.exe >/dev/null 2>&1' {
    set -s copy-command "clip.exe"
  }
}

bind-key -N 'Open scrollback' v copy-mode
bind-key -N 'Copy the last command output (OSC 133)' y {
  if -F '#{&&:#{pane_last_prompt_time},#{!:#{alternate_on}}}' {
    copy-mode
    send-keys -X copy-pipe-output
    send-keys -X cancel
  } {
    display-message "Command output requires OSC 133 shell integration"
  }
}

# Follow new output at the live edge, and hold position further back.
set-hook -g pane-mode-entered {
  if -F '#{==:#{pane_mode},copy-mode}' { send-keys -X refresh-on }
}

# PageUp follows the same application checks as mouse scrolling.
bind-key -n PPage {
  if -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' {
    send-keys PPage
  } {
    copy-mode -eu
  }
}

# Mouse history: scroll the hovered pane without changing keyboard focus.
# Preserve mouse handling in applications and alternate-screen programs.
bind-key -n WheelUpPane {
  if -Ft= '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' {
    send-keys -M
  } {
    copy-mode -e -t=
    send-keys -N 3 -X -t= scroll-up
  }
}
bind-key -T copy-mode-vi WheelUpPane send-keys -N 3 -X -t= scroll-up
bind-key -T copy-mode-vi WheelDownPane {
  send-keys -N 3 -X -t= scroll-down
  # Return to live output only when there is no selection to preserve.
  if -Ft= '#{&&:#{==:#{scroll_position},0},#{!:#{selection_present}}}' {
    send-keys -X -t= cancel
  }
}

# Click clears the highlight; a click at the live edge resumes normal input.
# At older output, keep the scroll position so a new drag starts there.
bind-key -T copy-mode-vi MouseDown1Pane {
  select-pane -t=
  send-keys -X -t= clear-selection
  if -Ft= '#{==:#{scroll_position},0}' { send-keys -X -t= cancel }
}

# Drag release, double click and triple click all copy without jumping back.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X -t= copy-pipe-no-clear
bind-key -T copy-mode-vi DoubleClick1Pane {
  select-pane -t=
  send-keys -X -t= select-word
  send-keys -X -t= copy-pipe-no-clear
}
bind-key -T copy-mode-vi TripleClick1Pane {
  select-pane -t=
  send-keys -X -t= select-line
  send-keys -X -t= copy-pipe-no-clear
}
bind-key -n DoubleClick1Pane {
  select-pane -t=
  if -Ft= '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
    send-keys -M
  } {
    copy-mode -H -t=
    send-keys -X -t= select-word
    send-keys -X -t= copy-pipe-no-clear
  }
}
bind-key -n TripleClick1Pane {
  select-pane -t=
  if -Ft= '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
    send-keys -M
  } {
    copy-mode -H -t=
    send-keys -X -t= select-line
    send-keys -X -t= copy-pipe-no-clear
  }
}

# Ctrl+C copies an existing selection; outside copy mode it still interrupts.
bind-key -T copy-mode-vi C-c if -F '#{selection_present}' {
  send-keys -X copy-pipe-no-clear
} {
  send-keys -X cancel
}
bind-key -T copy-mode-vi C-Home send-keys -X history-top
bind-key -T copy-mode-vi C-End send-keys -X cancel
bind-key -T copy-mode-vi End send-keys -X cancel
bind-key -T copy-mode End send-keys -X cancel

# Vim-ergonomic copy mode: incremental plain & regex search (next-3.9), line numbers.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-line-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi -N 'Search scrollback forward' /   command-prompt -Pi -T search -p "(search down)"       { send-keys -X search-forward-incremental -- "%%" }
bind-key -T copy-mode-vi -N 'Search scrollback backward' '?' command-prompt -Pi -T search -p "(search up)"         { send-keys -X search-backward-incremental -- "%%" }
bind-key -T copy-mode-vi -N 'Search scrollback forward with regex' M-/ command-prompt -Pi -T search -p "(regex search down)" { send-keys -X search-forward-incremental-regex -- "%%" }
bind-key -T copy-mode-vi -N 'Search scrollback backward with regex' M-? command-prompt -Pi -T search -p "(regex search up)"   { send-keys -X search-backward-incremental-regex -- "%%" }
bind-key -T copy-mode-vi -N 'Toggle scrollback line numbers' '#' send-keys -X line-numbers-toggle

# Jump between shell prompts (OSC 133; next-3.9 supports repeat counts like 3[ / 2]).
# Stock M-o selects command output; stock M-e opens selection/output in nvim.
bind-key -T copy-mode-vi [ send-keys -X previous-prompt
bind-key -T copy-mode-vi ] send-keys -X next-prompt
bind-key -T copy-mode-vi R {
  send-keys -X refresh-toggle
  display-message "copy mode: #{?refresh_active,live,frozen}"
}

# ── Appearance: Prompts, menus, modes, scrollbars ────────────────
set -g prompt-cursor-style blinking-bar
set -g prompt-cursor-colour "themeblue"
set -g prompt-command-cursor-colour "themeyellow"
set -g message-style "fg=themewhite,bg=$tmux_menu,fill=$tmux_menu,align=centre,width=62%"
set -g message-command-style "fg=themeyellow,bg=$tmux_menu,fill=$tmux_menu,bold,align=centre,width=62%"
set -g menu-style "fg=themewhite,bg=$tmux_menu"
set -g menu-selected-style "fg=$tmux_bar,bg=themeblue,bold"
set -g menu-border-style "fg=$tmux_focus,bg=$tmux_menu"
set -g menu-border-lines rounded

set -g mode-style "fg=$tmux_bar,bg=themeblue,bold"
set -g copy-mode-selection-style "fg=$tmux_text,bg=$tmux_selection"
set -g copy-mode-match-style "fg=$tmux_gold,bg=$tmux_pill,bold"
set -g copy-mode-current-match-style "fg=$tmux_bar,bg=$tmux_gold,bold"
set -g copy-mode-current-line-style "bg=$tmux_surface"
set -g copy-mode-mark-style "fg=$tmux_bar,bg=$tmux_magenta,bold"
set -g copy-mode-position-style "fg=$tmux_accent,bg=$tmux_pill,bold"
set -g copy-mode-position-format "#[align=right] #{?#{e|>:#{top_line_time},0},#[fg=$tmux_muted nobold]#{t/p:top_line_time} #[fg=$tmux_divider]· #[fg=$tmux_accent bold],}#{copy_position}/#{copy_position_limit}#{?search_timed_out, #[fg=$tmux_error]timed out,#{?search_count_present, #[fg=$tmux_divider]· #[fg=$tmux_gold]#{?#{==:#{search_count},0},0 matches,#{?search_count_partial,#{search_count}+,#{?#{==:#{search_count},1},1/1,#{?search_count_current,#{search_count_current}/#{search_count},#{search_count}}}}},}} "
set -g copy-mode-line-numbers off
set -g copy-mode-line-number-style "fg=$tmux_inactive"
set -g copy-mode-current-line-number-style "fg=$tmux_accent,bold"

set -g switch-mode-match-style "fg=themeblue,bold"
set -g tree-mode-border-style "fg=$tmux_border,bg=default"
set -g tree-mode-selection-style "fg=$tmux_bar,bg=themeblue,bold"
set -g tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},themeblue,themelightgrey}"
set -g tree-mode-preview-format " #{?pane_format,#{pane_index} · #{pane_current_command}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host}}}, · #{pane_title},},#{window_index} · #{window_name}} "
set -g display-panes-active-colour "themeblue"
set -g display-panes-colour "themelightgrey"
set -g display-panes-border-style "fg=$tmux_focus,bg=$tmux_menu"
set -g display-panes-format "#[align=right] #{pane_current_command} · #{pane_unzoomed_width}×#{pane_unzoomed_height} "
set -g clock-mode-colour "themeblue"
set -g fill-character "#{?is_inside,#[bg=$tmux_base] ,#[bg=$tmux_bar fg=$tmux_divider]·}"

set -g pane-scrollbars auto-hide
set -g pane-scrollbars-timeout 1500
set -g pane-scrollbars-style "fg=$tmux_inactive,bg=$tmux_bar,width=1,pad=0"

# ── Appearance: Sculpted pane chrome (next-3.9 & OSC 7501) ────────
# Default to airy `joined` borders (Alt+a B cycles joined / separate-active / separate).
# Composed focus borders while keeping inactive pane content colours untouched.
set -g pane-border-status top
set -g pane-border-lines rounded
set -g pane-border-indicators colour
set -g pane-border-style "fg=$tmux_border"
set -g pane-active-border-style "fg=$tmux_pane_focus"
set -g window-style default
set -g window-active-style default

# Native next-3.9 100ms Braille spinner (zero redraws while idle).
set -g @spinner '#{A/1:⠋,⠙,⠹,⠸,⠼,⠴,⠦,⠧,⠇,⠏}'

set -g @pane-path '#{q/h;s|^#{HOME}$|~|;s|^#{HOME}/|~/|:pane_current_path}'
# Floating tools keep their explicit titles. Other panes show the running
# command or the shell directory.
%hidden tmux_has_title='#{&&:#{pane_title},#{!=:#{pane_title},#{host}}}'
%hidden tmux_pane_title='#{q/h;s~^ +| +$~~:pane_title}'
set -g @pane-label "#{?#{&&:#{pane_floating_flag},$tmux_has_title},$tmux_pane_title,#{&&:#{pane_command_running},#{pane_command_line}},#{q/h;s~^ +| +$~~:pane_command_line},#{E:@shell-active},#{s~ +$~~:#{E:@pane-path}},$tmux_has_title,$tmux_pane_title,#{q/h:pane_current_command}}"

# OSC 133 refreshes the prompt context. OSC 7501, OSC 9;4 and title
# updates already trigger redraws in the installed tmux.
set-hook -g pane-shell-prompt 'refresh-client -S'
set-hook -g pane-command-started 'refresh-client -S'
set-hook -g pane-command-finished 'refresh-client -S'

# Remove the previous config's monitor and redraw hooks on an in-place reload.
if -F '#{m:*@agent-monitor*,#{session-created[0]}}' { set-hook -gu 'session-created[0]' }
if -F '#{==:#{pane-title-changed[0]},refresh-client -S}' { set-hook -gu 'pane-title-changed[0]' }
run-shell -C '#{S:#{?@agent-monitor,set-option -uq -t #{q:session_id} @agent-monitor; ,}}'

# OSC 133: exit code on failure and elapsed time for commands >= 5s.
set -g @pane-elapsed '#{?#{e|>=:#{pane_command_duration},60},#{e|/:#{pane_command_duration},60}m#{e|m:#{pane_command_duration},60}s,#{pane_command_duration}s}'
set -g @pane-command-result "#{?#{&&:#{pane_last_prompt_time},#{!:#{pane_command_running}}},#{?pane_command_status, #[fg=$tmux_error]× #{pane_command_status},}#{?#{e|>=:#{pane_command_duration},5}, #[fg=$tmux_muted]#{E:@pane-elapsed},},}"

# Minimal text-first state cues: sync, mark, OSC 7501 status, OSC 9;4 progress.
set -g @pane-program-badge "#{?pane_program_state,#{?#{==:#{pane_program_state},blocked}, #[fg=$tmux_gold]◆ blocked#{?pane_program_message, · #{q/h;=/18/…:pane_program_message},},#{==:#{pane_program_state},error}, #[fg=$tmux_error]× error#{?pane_program_message, · #{q/h;=/18/…:pane_program_message},},#{==:#{pane_program_state},working}, #[fg=$tmux_cyan]#{E:@spinner} working#{?pane_program_message, · #{q/h;=/18/…:pane_program_message},},#{==:#{pane_program_state},done}, #[fg=$tmux_green]✓ done,},}"
# The working badge supplies the spinner when both protocols report activity.
set -g @pane-pb-badge "#{?#{==:#{pane_pb_state},hidden},,#{==:#{pane_pb_state},normal}, #[fg=$tmux_accent]#{pane_pb_progress}%,#{==:#{pane_pb_state},indeterminate},#{?#{!=:#{pane_program_state},working}, #[fg=$tmux_cyan]#{E:@spinner},},#{==:#{pane_pb_state},paused}, #[fg=$tmux_gold]‖ #{pane_pb_progress}%,#{==:#{pane_pb_state},error}, #[fg=$tmux_error]× #{pane_pb_progress}%,}"
set -g @pane-state "#{?pane_synchronized, #[fg=$tmux_bar bg=$tmux_error bold] SYNC #[default],}#{?pane_marked, #[fg=$tmux_magenta]MARK,}#{E:@pane-program-badge}#{E:@pane-pb-badge}"

# Native pane-border mouse ranges: quiet muted controls that stay out of the way.
set -g @pane-controls "#{?pane_active,#[fg=$tmux_muted],#[fg=$tmux_inactive]}"
set -ag @pane-controls '#{?#{&&:#{e|>=:#{pane_width},16},#{!:#{window_zoomed_flag}},#{!:#{pane_modal_flag}}},#[range=control|7] #{?pane_floating_flag,↙,↗} #[norange],}'
set -ag @pane-controls '#{?#{&&:#{e|>=:#{pane_width},12},#{e|>:#{window_panes},1},#{!:#{pane_modal_flag}}},#[range=control|8] #{?window_zoomed_flag,▣,□} #[norange],}'
set -ag @pane-controls '#[range=control|9] × #[norange]'

# Quiet tonal pane leads: ◇ for floating, muted blue pill for active split, ●/○ for single pane.
set -g @pane-lead "#{?pane_floating_flag,#{?pane_active,#[fg=$tmux_accent] ◇,#[fg=$tmux_muted] ◇},#{e|>:#{window_panes},1},#{?pane_active,#[fg=$tmux_accent bg=$tmux_pane_badge bold] #P #[default],#[fg=$tmux_inactive] #P},#{?pane_active,#[fg=$tmux_focus] ●,#[fg=$tmux_inactive] ○}}"
set -g @pane-detail-raw "#{E:@pane-state}#{E:@pane-command-result}"
# Measure the space between the starting inset and the mouse controls.
set -g @pane-control-start '#{e|-:#{e|-:#{pane_width},2},#{?mouse,#{w;E:@pane-controls},0}}'

# Each detail starts with a space. Insert the divider there before trimming
# the styled result. Skip the detail if its available width is under eight cells.
%hidden tmux_pane_detail="#{?#{e|>=:DETAIL_WIDTH,8},#{=/DETAIL_WIDTH;s~^ ~ #[fg=$tmux_divider]· ~:#{E:@pane-detail-raw}},}"
set -g @pane-label-format '#{?#{e|>:LABEL_ROOM,0},#{=/-LABEL_ROOM/…:#{E:@pane-label}},}'
# Measure this caption for centering. Use numeric substitutions so paths,
# application titles and OSC messages remain data.
set -g @pane-caption-content "#{E:@pane-lead} #{?pane_active,#[fg=$tmux_text],#[fg=$tmux_muted]}#{E:#{s~LABEL_ROOM~#{e|-:DETAIL_WIDTH,#{w:$tmux_pane_detail}}~:@pane-label-format}}$tmux_pane_detail "
%hidden tmux_pane_caption='#{?#{e|>:BORDER_EDGE,0},#{=/BORDER_EDGE:#{E:#{s~DETAIL_WIDTH~#{e|-:#{e|-:BORDER_EDGE,3},#{w;E:@pane-lead}}~:@pane-caption-content}}},}'

%hidden tmux_caption_room='#{e|-:BORDER_EDGE,CAPTION_WIDTH}'
%hidden tmux_caption_centre='#{e|/:#{e|-:#{e|-:#{pane_width},4},CAPTION_WIDTH},2}'
%hidden tmux_caption_left="#{?#{e|<:$tmux_caption_centre,$tmux_caption_room},$tmux_caption_centre,$tmux_caption_room}"
%hidden tmux_caption_right="#{e|-:$tmux_caption_room,#{?#{e|>:$tmux_caption_centre,0},$tmux_caption_centre,0}}"
set -g @pane-border-pad-cell '#{?#{&&:#{==:#{pane-border-type},separate-active},#{!:#{pane_active}}}, ,─}'
%hidden tmux_pane_border="#{R:#{E:@pane-border-pad-cell},$tmux_caption_left}$tmux_pane_caption#{?mouse,#[default]#{R:#{E:@pane-border-pad-cell},$tmux_caption_right}#{E:@pane-controls},}"
set -g @pane-border-layout "#{E:#{s~CAPTION_WIDTH~#{w:$tmux_pane_caption}~:#{l:$tmux_pane_border}}}"
set -g pane-border-format '#{E:#{s~BORDER_EDGE~#{E:@pane-control-start}~:@pane-border-layout}}'

# ── Top bar (Zero-Layout-Shift uniform tab grid) ─────────────────
set -g status-position top
set -g status-interval 2
set -g status-style "fg=$tmux_muted,bg=$tmux_bar"
set -g status-left-length 26
set -g status-right-length 56

# Constant-width left anchor: modes recolor the capsule in place so pressing
# prefix/copy/move/sync never shifts the window tabs horizontally.
set -g @session-name-width '#{?#{e|>=:#{client_width},100},16,#{e|>=:#{client_width},64},10,#{e|>=:#{client_width},42},7,5}'
set -g @session-text '#{q/h;=/#{E:@session-name-width}/…:session_name}'
set -g @session-lead "#{?pane_synchronized,#[fg=$tmux_bar bg=$tmux_error bold] ⇄ #{E:@session-text} #[default],#{==:#{client_key_table},prefix},#[fg=$tmux_bar bg=$tmux_gold bold] ⌘ #{E:@session-text} #[default],#{==:#{client_key_table},move},#[fg=$tmux_bar bg=$tmux_magenta bold] ✛ #{E:@session-text} #[default],#{==:#{pane_mode},copy-mode},#[fg=$tmux_bar bg=$tmux_accent bold] ▤ #{E:@session-text} #[default],#[bg=$tmux_pill fg=$tmux_accent] ◈ #[fg=$tmux_text bold]#{E:@session-text} #[default]}"
set -g status-left "#{E:@session-lead} "

# Bounded right anchor: mode info swaps in place of the cwd so status-right
# stays within a fixed width envelope across all paths and modes.
set -g @status-path-width '#{?#{e|>=:#{client_width},130},23,#{e|>=:#{client_width},88},17,#{e|>=:#{client_width},60},12,#{e|>=:#{client_width},46},9,7}'
set -g @status-path-trunc '#{e|-:#{E:@status-path-width},1}'
set -g @status-cwd-raw '#{?#{e|>=:#{client_width},88},#{?#{e|<=:#{w:#{E:@pane-path}},#{E:@status-path-width}},#{E:@pane-path},#{s|^…[^/]*/|…/|:#{=/-#{E:@status-path-trunc}/…:#{E:@pane-path}}}},#{?#{==:#{pane_current_path},#{HOME}},~,#{?#{e|<=:#{w:#{b;q/h:pane_current_path}},#{E:@status-path-width}},#{b;q/h:pane_current_path},#{b;q/h;=/#{E:@status-path-trunc}/…:pane_current_path}}}}'
# Color the directory prefix and basename in one pass over the fitted path.
set -g @status-cwd "#[fg=$tmux_subtext]#{s~^(.*/)([^/]+)$~#[fg=$tmux_muted]\\1#[fg=$tmux_subtext]\\2~;s~^(.+/)$~#[fg=$tmux_muted]\\1#[fg=$tmux_subtext]~:#{E:@status-cwd-raw}}"
# A modal search pane leaves the previous workspace directory in the bar.
set -g @status-path '#{?pane_modal_flag,#{P:#{?pane_last,#{E:@status-cwd},}},#{E:@status-cwd}}'
set -g @status-mode-active '#{||:#{pane_synchronized},#{==:#{client_key_table},prefix},#{==:#{client_key_table},move},#{==:#{pane_mode},copy-mode}}'
set -g @status-mode-full "#{?pane_synchronized,#[fg=$tmux_error bold]SYNC#[nobold fg=$tmux_divider] · #[fg=$tmux_muted]a off,#{==:#{client_key_table},prefix},#[fg=$tmux_gold bold]PREFIX#[nobold fg=$tmux_divider] · #[fg=$tmux_muted]? menu · f win,#{==:#{client_key_table},move},#[fg=$tmux_magenta bold]MOVE#[nobold fg=$tmux_divider] · #[fg=$tmux_muted]hjkl · c centre,#{==:#{pane_mode},copy-mode},#[fg=$tmux_accent bold]COPY#[nobold fg=$tmux_divider] · #[fg=$tmux_muted]#{?selection_present,y copy · C-v blk,v sel · / find},}"
set -g @status-mode-short "#{?pane_synchronized,#[fg=$tmux_error bold]SYNC,#{==:#{client_key_table},prefix},#[fg=$tmux_gold bold]PREFIX,#{==:#{client_key_table},move},#[fg=$tmux_magenta bold]MOVE,#{==:#{pane_mode},copy-mode},#[fg=$tmux_accent bold]COPY,}"
set -g @status-context "#{?#{E:@status-mode-active},#{?#{e|>=:#{client_width},100},#{E:@status-mode-full},#{E:@status-mode-short}},#{E:@status-path}}"
set -g @status-clock "#{?#{e|>=:#{client_width},46}, #[fg=$tmux_divider]│ #[fg=$tmux_text]%H:%M,}"
set -g status-right "#{?#{e|>=:#{client_width},28}, #{E:@status-context}#{T:@status-clock}#{?mouse, #[range=control|0 fg=$tmux_accent bg=$tmux_pill] ⋯ #[range=right default], },}"

# Deterministic uniform tab slot width: depends ONLY on client_width, session_windows,
# and session name width — never on active window name, cwd, or mode.
set -g @status-right-reserve '#{?#{e|>=:#{client_width},130},37,#{e|>=:#{client_width},88},31,#{e|>=:#{client_width},60},25,#{e|>=:#{client_width},46},22,12}'
set -g @tab-budget '#{e|-:#{e|-:#{client_width},#{e|+:#{w;q/h;=/#{E:@session-name-width}/…:session_name},5}},#{E:@status-right-reserve}}'
set -g @tab-slot-raw '#{?#{e|>:#{session_windows},0},#{e|/:#{E:@tab-budget},#{session_windows}},13}'
# Clamp the raw integer to 4..13 after expanding it once.
set -g @tab-slot '#{s~^(-[0-9]+|[0-3])$~4~;s~^(1[4-9]|[2-9][0-9]|[0-9][0-9][0-9]+)$~13~:#{E:@tab-slot-raw}}'

# Read a single pane directly. For splits, take the highest-priority state.
set -g @split-agent-state-format '#{?#{m:*blocked*,PANE_STATES},blocked,#{m:*error*,PANE_STATES},error,#{m:*working*,PANE_STATES},working,#{m:*done*,PANE_STATES},done,}'
set -g @window-agent-state '#{?#{==:#{window_panes},1},#{?#{!=:#{pane_program_state},idle},#{pane_program_state},},#{E:#{s~PANE_STATES~#{P:#{pane_program_state} ,#{pane_program_state} }~:@split-agent-state-format}}}'
%hidden tmux_window_alert_markers="#{?window_zoomed_flag, #[fg=$tmux_accent]▣,}#{?window_bell_flag, #[fg=$tmux_gold]!,}#{?#{&&:#{window_activity_flag},#{!:#{window_bell_flag}}}, #[fg=$tmux_gold]•,}"

%hidden tmux_tab_room='#{e|-:#{E:@tab-slot},#{e|+:#{w:window_index},1}}'
%hidden tmux_tab_prefix_fits='#{e|>=:TAB_ROOM,2}'
%hidden tmux_tab_prefix="#{?$tmux_tab_prefix_fits,#{?#{==:TAB_STATE,working},#[fg=$tmux_cyan]#{E:@spinner} ,#{==:TAB_STATE,done},#[fg=$tmux_green]✓ ,},}"
%hidden tmux_tab_prefix_width="#{?#{&&:$tmux_tab_prefix_fits,#{||:#{==:TAB_STATE,working},#{==:TAB_STATE,done}}},2,0}"
%hidden tmux_tab_body_space="#{e|-:TAB_ROOM,$tmux_tab_prefix_width}"

# Each marker uses two cells. Reserve one trailing cell before fitting markers.
%hidden tmux_tab_markers="#{?#{==:BODY_STATE,blocked}, #[fg=$tmux_gold]◆,#{==:BODY_STATE,error}, #[fg=$tmux_error]×,}$tmux_window_alert_markers"
%hidden tmux_tab_marker_cells='#{w:#{?#{||:#{==:BODY_STATE,blocked},#{==:BODY_STATE,error}},xx,}#{?window_zoomed_flag,xx,}#{?#{||:#{window_bell_flag},#{window_activity_flag}},xx,}}'
%hidden tmux_tab_has_markers='#{||:#{==:BODY_STATE,blocked},#{==:BODY_STATE,error},#{window_zoomed_flag},#{window_bell_flag},#{window_activity_flag}}'
%hidden tmux_tab_markers_fit="#{e|<:$tmux_tab_marker_cells,BODY_SPACE}"
%hidden tmux_tab_name_space="#{e|-:#{e|-:BODY_SPACE,1},#{?$tmux_tab_markers_fit,$tmux_tab_marker_cells,0}}"
%hidden tmux_tab_right="#{?$tmux_tab_markers_fit,$tmux_tab_markers , }"

# Pad by display width after quoting the title's literal hashes.
%hidden tmux_tab_name_text='#{?#{e|>=:TAB_NAME_SPACE,3}, #{?#{e|<:#{w:window_name},TAB_NAME_SPACE},#{q/h:window_name},#{q/h;=/#{e|-:TAB_NAME_SPACE,2}/…:window_name}},#{&&:#{==:TAB_NAME_SPACE,2},#{==:#{w:window_name},1}}, #{q/h:window_name},}'
set -g @tab-name-format "$tmux_tab_name_text#{?window_active,#[nobold],}#{R: ,#{e|-:TAB_NAME_SPACE,#{w:$tmux_tab_name_text}}}"
# With fewer than three cells, neither a title nor a marker fits.
set -g @tab-body-format "#{?#{e|>=:BODY_SPACE,3},#{E:#{s~TAB_NAME_SPACE~#{?$tmux_tab_has_markers,$tmux_tab_name_space,#{e|-:BODY_SPACE,1}}~:@tab-name-format}}#{?$tmux_tab_has_markers,$tmux_tab_right, },#{?window_active,#[nobold],}#{R: ,BODY_SPACE}}"

# Keep the active tab cool and use a softer amber for manually named tabs.
%hidden tmux_tab_bg="#{?#{==:#{client_active_theme},light},#e2e8f0,#222b37}"
%hidden tmux_tab_accent="#{?#{==:#{client_active_theme},light},#4c6889,#88a4c1}"
%hidden tmux_tab_index="#{?#{==:#{client_active_theme},light},#646d79,#9ca5b6}"
%hidden tmux_tab_named_index="#{?#{==:#{client_active_theme},light},#7d6641,#c6b18d}"
%hidden tmux_tab_named="#{?#{==:#{client_active_theme},light},#735c37,#baa580}"

set -g window-status-separator ""
set -g window-status-style "fg=$tmux_muted,bg=$tmux_bar"
set -g window-status-last-style default
set -g window-status-current-style "fg=$tmux_text,bg=$tmux_tab_bg"
set -g window-status-activity-style "fg=$tmux_gold"
set -g window-status-bell-style "fg=$tmux_gold,bold"

# Substitute available space and agent state once before drawing each tab.
%hidden tmux_tab_index_text="#[fg=#{?window_active,$tmux_tab_accent,#{?automatic-rename,$tmux_tab_index,$tmux_tab_named_index}}#{?window_active, bold,} italics]#I#[noitalics fg=#{?window_active,#{?automatic-rename,$tmux_text,$tmux_tab_named},#{?automatic-rename,$tmux_muted,$tmux_tab_named}}]"
# Draw an unmarked tab directly from its remaining cells.
%hidden tmux_tab_plain_body='#{?#{e|>=:TAB_ROOM,3},#{E:#{s~TAB_NAME_SPACE~#{e|-:TAB_ROOM,1}~:@tab-name-format}} ,#{?window_active,#[nobold],}#{R: ,TAB_ROOM}}'
set -g @tab-content-format "$tmux_tab_prefix$tmux_tab_index_text#{?#{||:TAB_STATE,#{window_zoomed_flag},#{window_bell_flag},#{window_activity_flag}},#{E:#{s~BODY_SPACE~$tmux_tab_body_space~;s~BODY_STATE~TAB_STATE~:@tab-body-format}},$tmux_tab_plain_body}"
# When the index fills the slot, skip agent and marker evaluation.
%hidden tmux_tab_content="#{?#{e|<:$tmux_tab_room,2},$tmux_tab_index_text#{?window_active,#[nobold],}#{R: ,$tmux_tab_room},#{E:#{s~TAB_ROOM~$tmux_tab_room~;s~TAB_STATE~#{E:@window-agent-state}~:@tab-content-format}}}"
set -g window-status-format " $tmux_tab_content"
set -g window-status-current-format "#[fg=$tmux_tab_accent]▎$tmux_tab_content"

# Resolve the slot width once per status row. Each tab uses that literal width.
# Direct expansions of the window formats still resolve their own slot width.
set -gu status-format
set -g @status-tab-list-format "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]#[fg=$tmux_accent bg=$tmux_pill] ‹ #[default]#[list=right-marker]#[fg=$tmux_accent bg=$tmux_pill] › #[default]#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:#{s~E#:@tab-slot[#}]~l#:ROW_TAB_SLOT#}~:window-status-format}}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:#{s~E#:@tab-slot[#}]~l#:ROW_TAB_SLOT#}~:window-status-current-format}}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set -g status-format[0] '#{E:#{s~ROW_TAB_SLOT~#{E:@tab-slot}~:@status-tab-list-format}}'

# ── Appearance: Architectural toggleable sidebar (Alt+a \) ────────
set -g side-status-width 24
set -g side-status-style "fg=$tmux_muted,bg=$tmux_bar"
set -g @sidebar-inner '#{e|-:#{side-status-width},1}'
set -g @sidebar-rule "#{?#{e|>=:#{E:@sidebar-inner},3},#[fg=$tmux_divider] #{R:─,#{e|-:#{E:@sidebar-inner},2}} #[default],}"
set -g @sidebar-session-left "#{?#{==:#{session_name},#{client_session}}, #[fg=$tmux_accent]▾ #[fg=$tmux_text bold]#{q/h;=/#{?#{e|>:#{E:@sidebar-inner},7},#{e|-:#{E:@sidebar-inner},7},1}/…:session_name}#[nobold], #[fg=$tmux_inactive]▸ #[fg=$tmux_muted]#{q/h;=/#{?#{e|>:#{E:@sidebar-inner},7},#{e|-:#{E:@sidebar-inner},7},1}/…:session_name}}"
set -g @sidebar-session-right " #[fg=$tmux_inactive]#{session_windows} "
# R emits no padding when the row already fills the available width.
set -g @sidebar-session-pad '#{R: ,#{e|-:#{E:@sidebar-inner},#{w:#{E:@sidebar-session-left}#{E:@sidebar-session-right}}}}'
# Reuse the selected program state and available title width in each row.
%hidden tmux_sidebar_win_badge="#{?#{==:SIDEBAR_STATE,working},#[fg=$tmux_cyan]#{E:@spinner} ,#{==:SIDEBAR_STATE,done},#[fg=$tmux_green]✓ ,}"
%hidden tmux_sidebar_win_marks="#{?#{==:SIDEBAR_STATE,blocked}, #[fg=$tmux_gold]◆,#{==:SIDEBAR_STATE,error}, #[fg=$tmux_error]×,}$tmux_window_alert_markers "
%hidden tmux_sidebar_win_room="#{e|-:#{E:@sidebar-inner},#{w:  #{window_index}  $tmux_sidebar_win_badge$tmux_sidebar_win_marks}}"
%hidden tmux_sidebar_win_name='#{?#{e|>:SIDEBAR_ROOM,0},#{q/h;=/SIDEBAR_ROOM/…:window_name},}'
set -g @sidebar-win-title "$tmux_sidebar_win_name#{?window_active,#[nobold],}#{R: ,#{e|-:#{e|+:SIDEBAR_ROOM,1},#{w:$tmux_sidebar_win_name}}}"
%hidden tmux_sidebar_win_inactive="  $tmux_sidebar_win_badge#[fg=#{?window_last_flag,$tmux_focus,$tmux_inactive}]#I #[fg=#{?automatic-rename,$tmux_muted,$tmux_gold}]"
%hidden tmux_sidebar_win_active="#[fg=$tmux_accent]▎ $tmux_sidebar_win_badge#[fg=$tmux_accent bold]#I #[fg=#{?automatic-rename,$tmux_text,$tmux_gold}]"
set -g @sidebar-win-layout "#{?window_active,$tmux_sidebar_win_active,$tmux_sidebar_win_inactive}#{E:#{s~SIDEBAR_ROOM~$tmux_sidebar_win_room~g:@sidebar-win-title}}$tmux_sidebar_win_marks"
set -g @sidebar-win-row '#{E:#{s~SIDEBAR_STATE~#{E:@window-agent-state}~g:@sidebar-win-layout}}'
set -g side-status-format "#[align=left fg=$tmux_muted bold] WORKSPACE#[nobold]#[align=right]#[range=control|1 fg=$tmux_muted] × #[norange default]#[nl]#[align=left]#{E:@sidebar-rule}#[nl]#[list=on]#[list=left-marker]#[fg=$tmux_accent]  ↑ more#[default]#[nl]#[list=right-marker]#[fg=$tmux_accent]  ↓ more#[default]#[nl]#{S:#[range=session|#{session_id}]#{E:@sidebar-session-left}#{E:@sidebar-session-pad}#{E:@sidebar-session-right}#[norange default]#[nl]#{?#{==:#{session_name},#{client_session}},#{W:#[range=window|#{window_index} fg=$tmux_muted bg=$tmux_bar]#{E:@sidebar-win-row}#[norange default]#[nl],#[range=window|#{window_index} list=focus bg=$tmux_surface fg=$tmux_text]#{E:@sidebar-win-row}#[norange list=on default]#[nl]},}}#[nolist align=left]#{E:@sidebar-rule}#[nl]#[align=left range=control|2 fg=$tmux_accent] + #[fg=$tmux_subtext]New window#[norange]"

# ── Session persistence (TPM + tmux-resurrect) ────────────────────
set -g @resurrect-processes "false"
set -g @resurrect-strategy-vim "session"
set -g @resurrect-strategy-nvim "session"
set -g @resurrect-capture-pane-contents "on"

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-resurrect"

if-shell 'test -x "$HOME/.tmux/plugins/tpm/tpm"' {
  run-shell "~/.tmux/plugins/tpm/tpm"
}
