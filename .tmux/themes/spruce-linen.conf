# Adaptive palette (Spruce Dark / Linen Light).
set -s theme detect

%hidden tmux_dark_base="#1a2422"
%hidden tmux_light_base="#faf7f0"
%hidden tmux_dark_menu="#22302d"
%hidden tmux_light_menu="#f7f3e9"
%hidden tmux_dark_muted="#9ab0a7"
%hidden tmux_light_muted="#4f6057"
%hidden tmux_dark_text="#eaf2eb"
%hidden tmux_light_text="#26392f"
%hidden tmux_dark_accent="#8fdcc6"
%hidden tmux_light_accent="#226653"
%hidden tmux_dark_cyan="#91cce6"
%hidden tmux_light_cyan="#285d76"
%hidden tmux_dark_green="#afd38e"
%hidden tmux_light_green="#3d6127"
%hidden tmux_dark_gold="#e8be83"
%hidden tmux_light_gold="#79511e"
%hidden tmux_dark_magenta="#cdb5e8"
%hidden tmux_light_magenta="#694887"
%hidden tmux_dark_error="#f3a49d"
%hidden tmux_light_error="#a1342a"

set -s dark-theme-black       "$tmux_dark_base"
set -s dark-theme-dark-grey   "$tmux_dark_menu"
set -s dark-theme-light-grey  "$tmux_dark_muted"
set -s dark-theme-white       "$tmux_dark_text"
set -s dark-theme-blue        "$tmux_dark_accent"
set -s dark-theme-cyan        "$tmux_dark_cyan"
set -s dark-theme-green       "$tmux_dark_green"
set -s dark-theme-yellow      "$tmux_dark_gold"
set -s dark-theme-magenta     "$tmux_dark_magenta"
set -s dark-theme-red         "$tmux_dark_error"

set -s light-theme-black      "$tmux_light_base"
set -s light-theme-dark-grey  "$tmux_light_menu"
set -s light-theme-light-grey "$tmux_light_muted"
set -s light-theme-white      "$tmux_light_text"
set -s light-theme-blue       "$tmux_light_accent"
set -s light-theme-cyan       "$tmux_light_cyan"
set -s light-theme-green      "$tmux_light_green"
set -s light-theme-yellow     "$tmux_light_gold"
set -s light-theme-magenta    "$tmux_light_magenta"
set -s light-theme-red        "$tmux_light_error"

# Pane borders, the status line and the sidebar resolve native colours per client.
%hidden tmux_muted="themelightgrey"
%hidden tmux_text="themewhite"
%hidden tmux_accent="themeblue"
%hidden tmux_cyan="themecyan"
%hidden tmux_green="themegreen"
%hidden tmux_gold="themeyellow"
%hidden tmux_magenta="thememagenta"
%hidden tmux_error="themered"

# Prompts, menus and copy mode can resolve styles without a client.
%hidden tmux_mode_base="#{?#{==:#{client_active_theme},light},$tmux_light_base,$tmux_dark_base}"
%hidden tmux_mode_menu="#{?#{==:#{client_active_theme},light},$tmux_light_menu,$tmux_dark_menu}"
%hidden tmux_mode_muted="#{?#{==:#{client_active_theme},light},$tmux_light_muted,$tmux_dark_muted}"
%hidden tmux_mode_text="#{?#{==:#{client_active_theme},light},$tmux_light_text,$tmux_dark_text}"
%hidden tmux_mode_accent="#{?#{==:#{client_active_theme},light},$tmux_light_accent,$tmux_dark_accent}"
%hidden tmux_mode_gold="#{?#{==:#{client_active_theme},light},$tmux_light_gold,$tmux_dark_gold}"
%hidden tmux_mode_magenta="#{?#{==:#{client_active_theme},light},$tmux_light_magenta,$tmux_dark_magenta}"
%hidden tmux_mode_error="#{?#{==:#{client_active_theme},light},$tmux_light_error,$tmux_dark_error}"

# Surfaces and accents beyond tmux's native slots.
%hidden tmux_bar="#{?#{==:#{client_active_theme},light},#ebe7dd,#111b1a}"
%hidden tmux_surface="#{?#{==:#{client_active_theme},light},#f8f4eb,#263532}"
%hidden tmux_pill="#{?#{==:#{client_active_theme},light},#dde6db,#2c423c}"
%hidden tmux_selection="#{?#{==:#{client_active_theme},light},#c4ddd2,#31514a}"
%hidden tmux_divider="#{?#{==:#{client_active_theme},light},#9bada1,#4a635b}"
%hidden tmux_border="#{?#{==:#{client_active_theme},light},#abb8a8,#394d46}"
%hidden tmux_pane_focus="#{?#{==:#{client_active_theme},light},#4b786c,#639789}"
%hidden tmux_pane_badge="#{?#{==:#{client_active_theme},light},#d6e7dd,#29463f}"
%hidden tmux_focus="#{?#{==:#{client_active_theme},light},#396e61,#79b4a3}"
%hidden tmux_inactive="#{?#{==:#{client_active_theme},light},#5c6d63,#889f96}"
%hidden tmux_subtext="#{?#{==:#{client_active_theme},light},#384b42,#c5d3cb}"

# Active tabs use mint green and manually named tabs use amber.
%hidden tmux_tab_bg="#{?#{==:#{client_active_theme},light},#d5e4d9,#25423a}"
%hidden tmux_tab_accent="#{?#{==:#{client_active_theme},light},#296853,#9ae4cb}"
%hidden tmux_tab_index="#{?#{==:#{client_active_theme},light},#596b61,#a6bdb2}"
%hidden tmux_tab_named_index="#{?#{==:#{client_active_theme},light},#785a32,#ccad80}"
%hidden tmux_tab_named="#{?#{==:#{client_active_theme},light},#6d4d28,#debf91}"
